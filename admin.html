<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Panel Administrador | Polirubro Virtual</title>
    <link rel="stylesheet" href="style.css?v=261">
    <style>
        body.admin-body { background-color: #0b0f19 !important; color: #f8fafc !important; font-family: system-ui, -apple-system, sans-serif !important; }
        .admin-wrapper { max-width: 1200px; margin: 0 auto; padding: 1.5rem 1rem; }
        .admin-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 1.5rem; align-items: start; }
        @media (max-width: 900px) { .admin-grid { grid-template-columns: 1fr; } }
        .admin-card { background: #0f172a; border: 1px solid #1e293b; border-radius: 18px; padding: 1.2rem; box-shadow: 0 8px 20px rgba(0,0,0,0.4); margin-bottom: 1.5rem; }
        .admin-card h3 { margin: 0 0 1rem 0; font-size: 1.1rem; color: #38bdf8; border-bottom: 1px solid #1e293b; padding-bottom: 0.5rem; }
        .form-group { margin-bottom: 0.8rem; }
        .form-label { font-size: 0.82rem; color: #cbd5e1; display: block; margin-bottom: 0.3rem; }
        .form-input { width: 100%; padding: 0.6rem; border-radius: 8px; background: #1e293b; border: 1px solid #334155; color: #fff; outline: none; font-size: 0.9rem; }
        .btn-action { background: #2563eb; color: #fff; border: none; padding: 0.7rem; border-radius: 8px; font-weight: bold; cursor: pointer; width: 100%; transition: opacity 0.2s; margin-top: 0.4rem; }
        .btn-action:hover { opacity: 0.9; }
        .lista-items { display: flex; flex-direction: column; gap: 6px; max-height: 180px; overflow-y: auto; margin-top: 10px; }
        .item-row { display: flex; justify-content: space-between; align-items: center; background: #1e293b; padding: 8px 12px; border-radius: 8px; border: 1px solid #334155; font-size: 0.88rem; }
        .btn-delete { background: #ef4444; color: #fff; border: none; padding: 4px 8px; border-radius: 6px; font-size: 0.75rem; cursor: pointer; font-weight: bold; }
        .btn-edit { background: #f59e0b; color: #fff; border: none; padding: 4px 8px; border-radius: 6px; font-size: 0.75rem; cursor: pointer; font-weight: bold; margin-right: 4px; }
        .tabla-productos { width: 100%; border-collapse: collapse; margin-top: 10px; font-size: 0.85rem; }
        .tabla-productos th, .tabla-productos td { padding: 8px 10px; border-bottom: 1px solid #334155; text-align: left; }
        .tabla-productos th { color: #38bdf8; }
        .checkbox-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(70px, 1fr)); gap: 6px; background: #1e293b; padding: 10px; border-radius: 8px; border: 1px solid #334155; }
        .checkbox-label { font-size: 0.8rem; color: #f8fafc; display: flex; align-items: center; gap: 4px; cursor: pointer; }
    </style>
</head>
<body class="admin-body">
    <header style="background:#0f172a; padding:1.2rem; border-bottom:1px solid #1e293b; text-align:center;">
        <h1 style="margin:0; font-size:1.5rem; color:#fff;">⚙️ Panel Admin Polirubro (Auto-Sync)</h1>
        <p style="margin:0.3rem 0 0 0; color:#38bdf8; font-size:0.85rem;">Conexión Automática con GitHub</p>
        <div style="margin-top:0.8rem; display:flex; justify-content:center; gap:10px; flex-wrap:wrap;">
            <a href="/" target="_blank" style="background:#0284c7; color:#fff; padding:0.4rem 1rem; border-radius:20px; text-decoration:none; font-weight:bold; font-size:0.8rem;">🌐 Ir a la Tienda Pública</a>
            <button onclick="configurarCredenciales()" style="background:#f59e0b; color:#fff; border:none; padding:0.4rem 1rem; border-radius:20px; font-weight:bold; font-size:0.8rem; cursor:pointer;">🔑 Configurar Token GitHub</button>
        </div>
    </header>

    <div class="admin-wrapper">
        <div class="admin-grid">
            <div>
                <section class="admin-card">
                    <h3>📂 Gestionar Secciones</h3>
                    <div class="form-group">
                        <label class="form-label">Nueva Sección:</label>
                        <input type="text" id="inputNuevaCat" class="form-input" placeholder="Ej: Indumentaria, Calzado, Perfumería">
                    </div>
                    <button type="button" onclick="guardarSeccion()" class="btn-action" style="background: #2563eb;">✨ Guardar y Sincronizar</button>
                    
                    <div style="margin-top: 15px;">
                        <label class="form-label" style="font-weight: bold; color: #38bdf8;">Secciones Existentes:</label>
                        <div class="lista-items" id="listaSeccionesAdmin"></div>
                    </div>
                </section>
            </div>

            <div>
                <section class="admin-card">
                    <h3 id="tituloFormProducto">➕ Cargar Nuevo Producto</h3>
                    <input type="hidden" id="editIdProd" value="">
                    
                    <div class="form-group">
                        <label class="form-label">Nombre del Producto:</label>
                        <input type="text" id="prodNombre" class="form-input" placeholder="Ej: Perfume Sauvage / Alisado / Zapatillas">
                    </div>

                    <div class="form-group">
                        <label class="form-label">📝 Descripción Breve (Opcional):</label>
                        <textarea id="prodDescripcion" class="form-input" rows="2" placeholder="Ej: Fragancia de larga duración, excelente calidad..."></textarea>
                    </div>

                    <div style="display:grid; grid-template-columns:1fr 1fr; gap:0.8rem;" class="form-group">
                        <div>
                            <label class="form-label">Precio (\$):</label>
                            <input type="number" id="prodPrecio" class="form-input" placeholder="4000">
                        </div>
                        <div>
                            <label class="form-label">Stock:</label>
                            <input type="number" id="prodStock" class="form-input" value="10" min="0">
                        </div>
                    </div>
                    <div class="form-group">
                        <label class="form-label">Sección / Categoría:</label>
                        <select id="selectCategorias" class="form-input">
                            <option value="">Seleccioná una sección...</option>
                        </select>
                    </div>

                    <!-- TAMAÑOS / VOLÚMENES: PERFUMES Y LÍQUIDOS -->
                    <div class="form-group">
                        <label class="form-label">🧴 Tamaños / Volúmenes (Perfumes y Líquidos):</label>
                        <div class="checkbox-grid" id="grupoTamanios" style="grid-template-columns: repeat(auto-fill, minmax(85px, 1fr));">
                            <!-- Perfumes y muestras -->
                            <label class="checkbox-label"><input type="checkbox" value="15 ml"> 15 ml</label>
                            <label class="checkbox-label"><input type="checkbox" value="30 ml"> 30 ml</label>
                            <label class="checkbox-label"><input type="checkbox" value="50 ml"> 50 ml</label>
                            <!-- Líquidos y capilares -->
                            <label class="checkbox-label"><input type="checkbox" value="250 cc"> 250 cc</label>
                            <label class="checkbox-label"><input type="checkbox" value="500 cc"> 500 cc</label>
                            <label class="checkbox-label"><input type="checkbox" value="1 Litro"> 1 Litro</label>
                        </div>
                    </div>

                    <!-- TALLES MÚLTIPLES (CHECKBOXES) -->
                    <div class="form-group">
                        <label class="form-label">👕 Talles Disponibles (Podés marcar varios):</label>
                        <div class="checkbox-grid" id="grupoTalles">
                            <label class="checkbox-label"><input type="checkbox" value="S"> S</label>
                            <label class="checkbox-label"><input type="checkbox" value="M"> M</label>
                            <label class="checkbox-label"><input type="checkbox" value="L"> L</label>
                            <label class="checkbox-label"><input type="checkbox" value="XL"> XL</label>
                            <label class="checkbox-label"><input type="checkbox" value="XXL"> XXL</label>
                            <label class="checkbox-label"><input type="checkbox" value="36"> 36</label>
                            <label class="checkbox-label"><input type="checkbox" value="38"> 38</label>
                            <label class="checkbox-label"><input type="checkbox" value="40"> 40</label>
                            <label class="checkbox-label"><input type="checkbox" value="42"> 42</label>
                            <label class="checkbox-label"><input type="checkbox" value="44"> 44</label>
                            <label class="checkbox-label"><input type="checkbox" value="46"> 46</label>
                            <label class="checkbox-label"><input type="checkbox" value="48"> 48</label>
                            <label class="checkbox-label"><input type="checkbox" value="35"> 35(ARG)</label>
                            <label class="checkbox-label"><input type="checkbox" value="36"> 36(ARG)</label>
                            <label class="checkbox-label"><input type="checkbox" value="37"> 37(ARG)</label>
                            <label class="checkbox-label"><input type="checkbox" value="38"> 38(ARG)</label>
                            <label class="checkbox-label"><input type="checkbox" value="39"> 39(ARG)</label>
                            <label class="checkbox-label"><input type="checkbox" value="40"> 40(ARG)</label>
                            <label class="checkbox-label"><input type="checkbox" value="41"> 41(ARG)</label>
                            <label class="checkbox-label"><input type="checkbox" value="42"> 42(ARG)</label>
                            <label class="checkbox-label"><input type="checkbox" value="43"> 43(ARG)</label>
                            <label class="checkbox-label"><input type="checkbox" value="44"> 44(ARG)</label>
                        </div>
                    </div>

                    <!-- COLORES MÚLTIPLES (CHECKBOXES) -->
                    <div class="form-group">
                        <label class="form-label">🎨 Colores Disponibles (Podés marcar varios):</label>
                        <div class="checkbox-grid" id="grupoColores">
                            <label class="checkbox-label"><input type="checkbox" value="Blanco"> Blanco</label>
                            <label class="checkbox-label"><input type="checkbox" value="Negro"> Negro</label>
                            <label class="checkbox-label"><input type="checkbox" value="Rojo"> Rojo</label>
                            <label class="checkbox-label"><input type="checkbox" value="Azul"> Azul</label>
                            <label class="checkbox-label"><input type="checkbox" value="Amarillo"> Amarillo</label>
                            <label class="checkbox-label"><input type="checkbox" value="Verde"> Verde</label>
                            <label class="checkbox-label"><input type="checkbox" value="Gris"> Gris</label>
                            <label class="checkbox-label"><input type="checkbox" value="Celeste"> Celeste</label>
                            <label class="checkbox-label"><input type="checkbox" value="Rosa"> Rosa</label>
                            <label class="checkbox-label"><input type="checkbox" value="Violeta"> Violeta</label>
                            <label class="checkbox-label"><input type="checkbox" value="Naranja"> Naranja</label>
                            <label class="checkbox-label"><input type="checkbox" value="Marrón"> Marrón</label>
                            <label class="checkbox-label"><input type="checkbox" value="Beige"> Beige</label>
                            <label class="checkbox-label"><input type="checkbox" value="Dorado"> Dorado</label>
                            <label class="checkbox-label"><input type="checkbox" value="Plateado"> Plateado</label>
                        </div>
                    </div>

                    <div class="form-group" style="display:flex; align-items:center; gap:0.5rem; background:#1e293b; padding:0.6rem; border-radius:8px; border:1px solid #334155;">
                        <input type="checkbox" id="prodOferta" style="width:18px; height:18px; cursor:pointer;">
                        <label for="prodOferta" style="font-size:0.85rem; color:#f43f5e; font-weight:bold; cursor:pointer;">🔥 Oferta Especial (48hs)</label>
                    </div>
                    <div class="form-group">
                        <label class="form-label">🖼️ Imagen (Archivo PC/Celular o URL):</label>
                        <input type="file" id="fileInput" accept="image/*" onchange="convertirArchivoABase64(event)" style="margin-bottom:0.4rem; color: #cbd5e1; font-size: 0.85rem;">
                        <input type="url" id="urlInput" class="form-input" placeholder="O pegá una URL web aquí..." oninput="procesarImagenURL(this.value)">
                        <div id="previewContainer" style="display:none; margin-top:0.5rem; text-align:center; background:#070a12; padding:8px; border-radius:8px; border:1px dashed #38bdf8;">
                            <p style="font-size: 0.75rem; color: #38bdf8; margin-bottom: 4px;">Vista Previa:</p>
                            <img id="imgPreview" src="" alt="Preview" style="max-width:110px; max-height:110px; border-radius:6px; object-fit:contain;">
                            <p id="pesoPreview" style="font-size:0.75rem; color:#34d399; margin-top:0.2rem; font-weight:bold;"></p>
                        </div>
                    </div>
                    <button type="button" onclick="guardarProducto()" class="btn-action" style="background: #10b981;" id="btnGuardarProd">💾 Publicar en la Web (Automático)</button>
                    <button type="button" onclick="cancelarEdicion()" class="btn-action" style="background: #64748b; display:none;" id="btnCancelarEdicion">❌ Cancelar / Nuevo</button>
                </section>
            </div>
        </div>

        <section class="admin-card">
            <h3>📦 Productos en la Tienda</h3>
            <div style="overflow-x: auto;">
                <table class="tabla-productos">
                    <thead>
                        <tr>
                            <th>Nombre</th>
                            <th>Sección</th>
                            <th>Variantes (Tamaños/Talles/Colores)</th>
                            <th>Precio</th>
                            <th>Stock</th>
                            <th>Oferta</th>
                            <th>Acciones</th>
                        </tr>
                    </thead>
                    <tbody id="tablaProductosAdmin">
                        <tr><td colspan="7" style="text-align: center; color: #94a3b8;">Sincronizando con GitHub...</td></tr>
                    </tbody>
                </table>
            </div>
        </section>
    </div>

    <script>
        let imagenFinalBase64 = "";
        let datosTienda = { productos: [], categorias: ["Estética", "Electrónica", "Zapatería", "Accesorios", "Muebleria"] };

        function obtenerConfig() {
            let owner = localStorage.getItem("gh_owner") || "Walchu86";
            let repo = localStorage.getItem("gh_repo") || "polirubro-virtual";
            let token = localStorage.getItem("gh_token") || "";
            return { owner, repo, token };
        }

        function configurarCredenciales() {
            let conf = obtenerConfig();
            let tokenInput = prompt("Pegá tu Token de GitHub (Classic Token con permiso 'repo'):", conf.token);
            if (tokenInput !== null) {
                localStorage.setItem("gh_token", tokenInput.trim());
                let repoInput = prompt("Nombre de tu repositorio en GitHub:", conf.repo);
                if (repoInput) localStorage.setItem("gh_repo", repoInput.trim());
                let ownerInput = prompt("Tu usuario de GitHub:", conf.owner);
                if (ownerInput) localStorage.setItem("gh_owner", ownerInput.trim());
                alert("✅ ¡Credenciales guardadas correctamente!");
                location.reload();
            }
        }

        async function cargarPanelAdmin() {
            try {
                const res = await fetch('productos.json?v=' + Date.now());
                if (res.ok) {
                    datosTienda = await res.json();
                }
            } catch (e) {
                console.log("Usando estructura base.");
            }
            renderizarInterfaz();
        }

        function renderizarInterfaz() {
            let rawCats = datosTienda.categorias || ["Estética", "Electrónica", "Zapatería", "Accesorios", "Muebleria"];
            let listaNombresCats = rawCats.map(c => typeof c === 'string' ? c : (c.nombre || c.categoria || '')).filter(c => c !== '');

            const select = document.getElementById('selectCategorias');
            select.innerHTML = '<option value="">Seleccioná una sección...</option>';
            listaNombresCats.forEach(c => select.innerHTML += `<option value="${c}">${c}</option>`);

            const listaSec = document.getElementById('listaSeccionesAdmin');
            listaSec.innerHTML = '';
            listaNombresCats.forEach(c => {
                listaSec.innerHTML += `
                    <div class="item-row">
                        <span>🔹 ${c}</span>
                        <button class="btn-delete" onclick="eliminarSeccion('${c}')">Borrar</button>
                    </div>
                `;
            });

            const tbody = document.getElementById('tablaProductosAdmin');
            tbody.innerHTML = '';
            const prods = datosTienda.productos || [];

            if (prods.length === 0) {
                tbody.innerHTML = `<tr><td colspan="7" style="text-align: center; color: #94a3b8;">No hay productos cargados.</td></tr>`;
                return;
            }

            prods.forEach(p => {
                const badgeOferta = p.enOferta ? '<span style="color:#f43f5e; font-weight:bold;">🔥 Sí</span>' : '<span style="color:#94a3b8;">No</span>';
                const stockVal = p.stock !== undefined ? p.stock : 10;
                
                let resumenTC = [];
                if (p.tamanios && p.tamanios.length > 0) resumenTC.push(`Tam: ${p.tamanios.join(', ')}`);
                if (p.talles && p.talles.length > 0) resumenTC.push(`T: ${p.talles.join(', ')}`);
                else if (p.talle) resumenTC.push(`T: ${p.talle}`);
                
                if (p.colores && p.colores.length > 0) resumenTC.push(`C: ${p.colores.join(', ')}`);
                else if (p.color) resumenTC.push(`C: ${p.color}`);

                const talleColorVal = resumenTC.length > 0 ? `<span style="background:#334155; padding:2px 6px; border-radius:4px; font-size:0.75rem;">${resumenTC.join(' | ')}</span>` : '<span style="color:#64748b;">-</span>';
                const precioLimpinho = Number(p.precio || 0).toLocaleString('es-AR');
                
                tbody.innerHTML += `
                    <tr>
                        <td style="font-weight: bold; color: #fff;">${p.nombre}</td>
                        <td><span style="background: #1e293b; padding: 3px 8px; border-radius: 4px; border: 1px solid #334155; font-size: 0.78rem;">${p.categoria}</span></td>
                        <td>${talleColorVal}</td>
                        <td style="color: #38bdf8; font-weight: bold;">$${precioLimpinho}</td>
                        <td><span style="color: #34d399; font-weight: bold;">${stockVal} un.</span></td>
                        <td>${badgeOferta}</td>
                        <td>
                            <button class="btn-edit" onclick="prepararEdicion(${p.id})">Editar</button>
                            <button class="btn-delete" onclick="eliminarProducto(${p.id})">Eliminar</button>
                        </td>
                    </tr>
                `;
            });
        }

        async function sincronizarConGitHub() {
            const conf = obtenerConfig();
            if (!conf.token) {
                alert("⚠️ Primero configurá tu Token de GitHub.");
                configurarCredenciales();
                return false;
            }

            const url = `https://api.github.com/repos/${conf.owner}/${conf.repo}/contents/productos.json`;
            
            try {
                let sha = "";
                const resGet = await fetch(url, {
                    headers: { "Authorization": `token ${conf.token}` }
                });
                
                if (resGet.ok) {
                    const fileData = await resGet.json();
                    sha = fileData.sha;
                }

                const jsonString = JSON.stringify(datosTienda, null, 2);
                const contentBase64 = btoa(unescape(encodeURIComponent(jsonString)));

                const bodyData = {
                    message: "Actualización desde Panel Admin",
                    content: contentBase64,
                    sha: sha ? sha : undefined
                };

                const resPut = await fetch(url, {
                    method: "PUT",
                    headers: {
                        "Authorization": `token ${conf.token}`,
                        "Content-Type": "application/json"
                    },
                    body: JSON.stringify(bodyData)
                });

                if (resPut.ok) {
                    return true;
                } else {
                    const err = await resPut.json();
                    alert("❌ Error al sincronizar con GitHub: " + (err.message || "Token inválido"));
                    return false;
                }
            } catch (e) {
                console.error(e);
                alert("❌ Error de conexión con GitHub.");
                return false;
            }
        }

        async function guardarSeccion() {
            const input = document.getElementById('inputNuevaCat');
            const nombre = input.value.trim();
            if (!nombre) return alert("Escribí el nombre de la sección.");

            let rawCats = datosTienda.categorias || [];
            if (!rawCats.includes(nombre)) {
                rawCats.push(nombre);
                datosTienda.categorias = rawCats;

                let exito = await sincronizarConGitHub();
                if (exito) {
                    input.value = '';
                    renderizarInterfaz();
                    alert(`✅ Sección "${nombre}" guardada y publicada.`);
                }
            } else {
                alert("Esa sección ya existe.");
            }
        }

        async function eliminarSeccion(nombreCat) {
            if (confirm(`¿Seguro querés borrar la sección "${nombreCat}"?`)) {
                datosTienda.categorias = (datosTienda.categorias || []).filter(c => c !== nombreCat);
                let exito = await sincronizarConGitHub();
                if (exito) renderizarInterfaz();
            }
        }

        function convertirArchivoABase64(event) {
            const file = event.target.files[0];
            if (!file) return;
            const reader = new FileReader();
            reader.onload = function(e) {
                imagenFinalBase64 = e.target.result;
                document.getElementById("imgPreview").src = imagenFinalBase64;
                document.getElementById("pesoPreview").innerText = "Imagen cargada OK";
                document.getElementById("previewContainer").style.display = "block";
                document.getElementById("urlInput").value = "";
            };
            reader.readAsDataURL(file);
        }

        function procesarImagenURL(url) {
            if (!url || url.trim() === "") return;
            imagenFinalBase64 = url.trim();
            document.getElementById("imgPreview").src = imagenFinalBase64;
            document.getElementById("pesoPreview").innerText = "URL externa OK";
            document.getElementById("previewContainer").style.display = "block";
            document.getElementById("fileInput").value = "";
        }

        function normalizarTexto(txt) {
            return String(txt || '').replace(/\s+/g, '').toLowerCase();
        }

        function prepararEdicion(idProd) {
            const prod = (datosTienda.productos || []).find(p => p.id === idProd);
            if (!prod) return;

            document.getElementById('editIdProd').value = prod.id;
            document.getElementById('prodNombre').value = prod.nombre;
            document.getElementById('prodDescripcion').value = prod.descripcion || "";
            document.getElementById('prodPrecio').value = Number(prod.precio || 0);
            document.getElementById('prodStock').value = prod.stock !== undefined ? prod.stock : 10;
            document.getElementById('selectCategorias').value = prod.categoria;
            document.getElementById('prodOferta').checked = prod.enOferta || false;

            // Marcar tamaños guardados (reconoce con o sin espacios: 15ml / 15 ml, 30ml / 30 ml, 250cc / 250 cc)
            const tamArr = (prod.tamanios || []).map(normalizarTexto);
            document.querySelectorAll('#grupoTamanios input[type="checkbox"]').forEach(chk => {
                chk.checked = tamArr.includes(normalizarTexto(chk.value));
            });

            // Marcar talles guardados
            const talleArr = (prod.talles || (prod.talle ? [prod.talle] : [])).map(normalizarTexto);
            document.querySelectorAll('#grupoTalles input[type="checkbox"]').forEach(chk => {
                chk.checked = talleArr.includes(normalizarTexto(chk.value));
            });

            // Marcar colores guardados
            const colorArr = (prod.colores || (prod.color ? [prod.color] : [])).map(normalizarTexto);
            document.querySelectorAll('#grupoColores input[type="checkbox"]').forEach(chk => {
                chk.checked = colorArr.includes(normalizarTexto(chk.value));
            });

            if (prod.imagen) {
                imagenFinalBase64 = prod.imagen;
                document.getElementById("imgPreview").src = imagenFinalBase64;
                document.getElementById("pesoPreview").innerText = "Imagen actual cargada";
                document.getElementById("previewContainer").style.display = "block";
            }

            document.getElementById('tituloFormProducto').innerText = "✏️ Editar Producto";
            document.getElementById('btnGuardarProd').innerText = "💾 Guardar Cambios";
            document.getElementById('btnCancelarEdicion').style.display = "block";
            window.scrollTo({ top: 0, behavior: 'smooth' });
        }

        function cancelarEdicion() {
            document.getElementById('editIdProd').value = '';
            document.getElementById('prodNombre').value = '';
            document.getElementById('prodDescripcion').value = '';
            document.getElementById('prodPrecio').value = '';
            document.getElementById('prodStock').value = '10';
            document.getElementById('selectCategorias').value = '';
            document.getElementById('prodOferta').checked = false;
            document.querySelectorAll('#grupoTamanios input[type="checkbox"]').forEach(chk => chk.checked = false);
            document.querySelectorAll('#grupoTalles input[type="checkbox"]').forEach(chk => chk.checked = false);
            document.querySelectorAll('#grupoColores input[type="checkbox"]').forEach(chk => chk.checked = false);
            document.getElementById('urlInput').value = '';
            document.getElementById('fileInput').value = '';
            document.getElementById('previewContainer').style.display = 'none';
            imagenFinalBase64 = '';

            document.getElementById('tituloFormProducto').innerText = "➕ Cargar Nuevo Producto";
            document.getElementById('btnGuardarProd').innerText = "💾 Publicar en la Web (Automático)";
            document.getElementById('btnCancelarEdicion').style.display = "none";
        }

        async function guardarProducto() {
            const editId = document.getElementById('editIdProd').value;
            const nombre = document.getElementById('prodNombre').value.trim();
            const descripcion = document.getElementById('prodDescripcion').value.trim();
            const precioRaw = document.getElementById('prodPrecio').value;
            const stockRaw = document.getElementById('prodStock').value;
            const categoria = document.getElementById('selectCategorias').value;
            const enOferta = document.getElementById('prodOferta').checked;

            // Recopilar tamaños seleccionados
            let tamaniosSeleccionados = [];
            document.querySelectorAll('#grupoTamanios input[type="checkbox"]:checked').forEach(chk => {
                tamaniosSeleccionados.push(chk.value);
            });

            // Recopilar talles seleccionados
            let tallesSeleccionados = [];
            document.querySelectorAll('#grupoTalles input[type="checkbox"]:checked').forEach(chk => {
                tallesSeleccionados.push(chk.value);
            });

            // Recopilar colores seleccionados
            let coloresSeleccionados = [];
            document.querySelectorAll('#grupoColores input[type="checkbox"]:checked').forEach(chk => {
                coloresSeleccionados.push(chk.value);
            });

            if (!nombre || !precioRaw || !categoria) return alert("Completá nombre, precio y sección.");
            if (!imagenFinalBase64) return alert("Por favor seleccioná una imagen.");

            const precio = Number(precioRaw);
            const stock = Number(stockRaw);

            if (!datosTienda.productos) datosTienda.productos = [];

            if (editId) {
                let index = datosTienda.productos.findIndex(p => p.id == editId);
                if (index !== -1) {
                    datosTienda.productos[index] = {
                        id: Number(editId),
                        nombre,
                        descripcion,
                        precio,
                        stock,
                        categoria,
                        tamanios: tamaniosSeleccionados,
                        talles: tallesSeleccionados,
                        colores: coloresSeleccionados,
                        enOferta,
                        imagen: imagenFinalBase64
                    };
                }
            } else {
                datosTienda.productos.push({
                    id: Date.now(),
                    nombre,
                    descripcion,
                    precio,
                    stock,
                    categoria,
                    tamanios: tamaniosSeleccionados,
                    talles: tallesSeleccionados,
                    colores: coloresSeleccionados,
                    enOferta,
                    imagen: imagenFinalBase64
                });
            }

            let exito = await sincronizarConGitHub();
            if (exito) {
                alert(`🎉 ¡Producto "${nombre}" publicado con éxito!`);
                cancelarEdicion();
                renderizarInterfaz();
            }
        }

        async function eliminarProducto(idProd) {
            if (confirm("¿Estás seguro de eliminar este producto?")) {
                datosTienda.productos = (datosTienda.productos || []).filter(p => p.id !== idProd);
                let exito = await sincronizarConGitHub();
                if (exito) renderizarInterfaz();
            }
        }

        window.onload = cargarPanelAdmin;
    </script>
</body>
</html>
