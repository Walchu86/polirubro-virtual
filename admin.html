<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Panel Administrador | Polirubro Virtual</title>
    <link rel="stylesheet" href="/style.css">
    <style>
        body.admin-body { background-color: #0b0f19 !important; color: #f8fafc !important; font-family: system-ui, -apple-system, sans-serif !important; }
        .admin-wrapper { max-width: 1250px; margin: 0 auto; padding: 1.5rem 1rem; }
        .grid-stats-cards { display: grid; grid-template-columns: repeat(3, 1fr); gap: 1rem; margin-bottom: 1.5rem; }
        .stat-box-clean { background: #1e293b; border: 1px solid #334155; border-radius: 16px; padding: 1.2rem 1rem; text-align: center; }
        .stat-box-clean h3 { color: #94a3b8; font-size: 0.82rem; margin: 0 0 0.3rem 0; text-transform: uppercase; }
        .stat-box-clean .num { font-size: 2rem; font-weight: 900; color: #38bdf8; }
        .admin-two-columns { display: grid; grid-template-columns: 1fr 1fr; gap: 1.5rem; align-items: start; }
        @media (max-width: 900px) { .grid-stats-cards { grid-template-columns: 1fr; } .admin-two-columns { grid-template-columns: 1fr; } }
    </style>
</head>
<body class="admin-body">
    <header style="background:#0f172a; padding:1.2rem; border-bottom:1px solid #1e293b; text-align:center;">
        <h1 style="margin:0; font-size:1.6rem; color:#fff;">⚙️ Panel de Control Administrador</h1>
        <p style="margin:0.3rem 0 0 0; color:#38bdf8; font-size:0.9rem;">Gestioná productos y secciones de manera local</p>
        <div style="margin-top:0.8rem;">
            <a href="/" target="_blank" style="background:#0284c7; color:#fff; padding:0.4rem 1rem; border-radius:20px; text-decoration:none; font-weight:bold; font-size:0.85rem;">🌐 Ir a la Tienda Pública</a>
        </div>
    </header>

    <div class="admin-wrapper">
        <div class="admin-two-columns">
            <div style="display:flex; flex-direction:column; gap:1.5rem; width: 100%;">
                
                <!-- GESTIONAR SECCIONES -->
                <section style="background:#0f172a; border:1px solid #1e293b; border-radius:18px; padding:1.2rem;">
                    <h3 style="margin:0 0 1rem 0; font-size:1.1rem; color:#38bdf8;">📂 Gestionar Secciones</h3>
                    <div style="display:flex; flex-direction:column; gap:0.8rem; margin-bottom:1.2rem;">
                        <div>
                            <label style="font-size:0.82rem; color:#cbd5e1; display:block; margin-bottom:0.3rem;">Nueva Sección:</label>
                            <input type="text" id="inputNuevaCat" placeholder="Ej: Bazar, Ferretería" style="width:100%; padding:0.6rem; border-radius:8px; background:#1e293b; border:1px solid #334155; color:#fff; outline:none;">
                        </div>
                        <button type="button" onclick="guardarSeccionLocal()" style="background:#2563eb; color:#fff; border:none; padding:0.7rem; border-radius:8px; font-weight:bold; cursor:pointer;">✨ Guardar Sección</button>
                    </div>
                </section>

                <!-- CARGAR NUEVO PRODUCTO -->
                <section style="background:#0f172a; border:1px solid #1e293b; border-radius:18px; padding:1.2rem;">
                    <h3 style="margin:0 0 1rem 0; font-size:1.1rem; color:#38bdf8;">➕ Cargar Nuevo Producto</h3>
                    <div id="productForm" style="display:flex; flex-direction:column; gap:0.8rem;">
                        <div>
                            <label style="font-size:0.82rem; color:#cbd5e1; display:block; margin-bottom:0.3rem;">Nombre del Producto:</label>
                            <input type="text" id="prodNombre" required placeholder="Ej: Protector Solar" style="width:100%; padding:0.6rem; border-radius:8px; background:#1e293b; border:1px solid #334155; color:#fff; outline:none;">
                        </div>
                        <div style="display:grid; grid-template-columns:1fr 1fr; gap:0.8rem;">
                            <div>
                                <label style="font-size:0.82rem; color:#cbd5e1; display:block; margin-bottom:0.3rem;">Precio (\$):</label>
                                <input type="number" id="prodPrecio" required placeholder="4000" style="width:100%; padding:0.6rem; border-radius:8px; background:#1e293b; border:1px solid #334155; color:#fff; outline:none;">
                            </div>
                            <div>
                                <label style="font-size:0.82rem; color:#cbd5e1; display:block; margin-bottom:0.3rem;">Stock:</label>
                                <input type="number" id="prodStock" required value="10" min="0" style="width:100%; padding:0.6rem; border-radius:8px; background:#1e293b; border:1px solid #334155; color:#fff; outline:none;">
                            </div>
                        </div>
                        <div>
                            <label style="font-size:0.82rem; color:#cbd5e1; display:block; margin-bottom:0.3rem;">Sección:</label>
                            <select id="selectCategorias" required style="width:100%; padding:0.6rem; border-radius:8px; background:#1e293b; border:1px solid #334155; color:#fff; outline:none;">
                                <option value="">Seleccioná una sección...</option>
                            </select>
                        </div>
                        <div style="display:flex; align-items:center; gap:0.5rem; background:#1e293b; padding:0.6rem; border-radius:8px; border:1px solid #334155;">
                            <input type="checkbox" id="prodOferta" style="width:18px; height:18px; cursor:pointer;">
                            <label for="prodOferta" style="font-size:0.85rem; color:#f43f5e; font-weight:bold; cursor:pointer;">🔥 Marcar como Producto en Oferta Destacada</label>
                        </div>
                        <div>
                            <label style="font-size:0.82rem; color:#cbd5e1; display:block; margin-bottom:0.3rem;">🖼️ Imagen (Archivo o URL):</label>
                            <input type="file" id="fileInput" accept="image/*" onchange="comprimirYConvertirImagen()" style="margin-bottom:0.4rem; color: #cbd5e1; font-size: 0.85rem;">
                            <input type="url" id="urlInput" placeholder="https://..." style="width:100%; padding:0.5rem; border-radius:8px; background:#1e293b; border:1px solid #334155; color:#fff; outline:none;">
                            <div id="previewContainer" style="display:none; margin-top:0.5rem; text-align:center;">
                                <img id="imgPreview" src="" alt="Preview" style="max-width:100px; max-height:100px; border-radius:8px; border:1px solid #38bdf8; background:#070a12; object-fit:contain;">
                                <p id="pesoPreview" style="font-size:0.75rem; color:#34d399; margin-top:0.2rem; font-weight:bold;"></p>
                            </div>
                        </div>
                        <button type="button" onclick="guardarProductoLocal()" style="background:#10b981; color:#fff; border:none; padding:0.8rem; border-radius:8px; font-weight:bold; cursor:pointer;">💾 Guardar Producto</button>
                    </div>
                </section>
            </div>
        </div>
    </div>

    <script>
        let imagenFinalBase64 = "";

        function cargarDatosAdmin() {
            let cats = ["General", "Electrónica", "Bazar"];
            const guardadas = localStorage.getItem('polirubro_categorias');
            if (guardadas) {
                try { cats = JSON.parse(guardadas); } catch(e){}
            }
            const select = document.getElementById('selectCategorias');
            select.innerHTML = '<option value="">Seleccioná una sección...</option>';
            cats.forEach(c => {
                select.innerHTML += `<option value="${c}">${c}</option>`;
            });
        }

        function guardarSeccionLocal() {
            const input = document.getElementById('inputNuevaCat');
            const nombre = input.value.trim();
            if (!nombre) {
                alert("Escribí el nombre de la sección.");
                return;
            }

            let cats = ["General", "Electrónica", "Bazar"];
            const guardadas = localStorage.getItem('polirubro_categorias');
            if (guardadas) {
                try { cats = JSON.parse(guardadas); } catch(e){}
            }

            if (!cats.includes(nombre)) {
                cats.push(nombre);
                localStorage.setItem('polirubro_categorias', JSON.stringify(cats));
            }

            input.value = '';
            cargarDatosAdmin();
            document.getElementById('selectCategorias').value = nombre;
            alert(`✅ Sección "${nombre}" creada con éxito.`);
        }

        function comprimirYConvertirImagen() {
            const fileInput = document.getElementById("fileInput");
            const file = fileInput.files[0];
            if (!file) return;
            const reader = new FileReader();
            reader.onload = function(e) {
                const img = new Image();
                img.src = e.target.result;
                img.onload = function() {
                    const canvas = document.createElement("canvas");
                    const MAX_WIDTH = 350;
                    const MAX_HEIGHT = 350;
                    let width = img.width;
                    let height = img.height;
                    if (width > height) {
                        if (width > MAX_WIDTH) { height *= MAX_WIDTH / width; width = MAX_WIDTH; }
                    } else {
                        if (height > MAX_HEIGHT) { width *= MAX_HEIGHT / height; height = MAX_HEIGHT; }
                    }
                    canvas.width = width;
                    canvas.height = height;
                    const ctx = canvas.getContext("2d");
                    ctx.drawImage(img, 0, 0, width, height);
                    imagenFinalBase64 = canvas.toDataURL("image/jpeg", 0.5);
                    document.getElementById("imgPreview").src = imagenFinalBase64;
                    document.getElementById("pesoPreview").innerText = "Imagen optimizada: ~" + Math.round(imagenFinalBase64.length / 1024) + " KB";
                    document.getElementById("previewContainer").style.display = "block";
                };
            };
            reader.readAsDataURL(file);
        }

        function guardarProductoLocal() {
            const nombre = document.getElementById('prodNombre').value.trim();
            const precio = document.getElementById('prodPrecio').value;
            const stock = document.getElementById('prodStock').value;
            const categoria = document.getElementById('selectCategorias').value;
            const enOferta = document.getElementById('prodOferta').checked;
            const urlImg = document.getElementById('urlInput').value.trim();

            if (!nombre || !precio || !categoria) {
                alert("Por favor completá el nombre, el precio y la sección del producto.");
                return;
            }

            const imagenFinal = imagenFinalBase64 || urlImg || 'https://via.placeholder.com/200?text=Sin+Imagen';

            let productos = [];
            const prodsGuardados = localStorage.getItem('polirubro_productos');
            if (prodsGuardados) {
                try { productos = JSON.parse(prodsGuardados); } catch(e){}
            }

            const nuevoProd = {
                id: Date.now(),
                nombre,
                precio: Number(precio),
                stock: Number(stock),
                categoria,
                enOferta,
                imagen: imagenFinal
            };

            productos.push(nuevoProd);
            localStorage.setItem('polirubro_productos', JSON.stringify(productos));

            alert(`🎉 ¡Producto "${nombre}" guardado con éxito! Ya se ve reflejado en tu tienda.`);
            
            // Limpiar formulario
            document.getElementById('prodNombre').value = '';
            document.getElementById('prodPrecio').value = '';
            document.getElementById('prodStock').value = '10';
            document.getElementById('prodOferta').checked = false;
            document.getElementById('urlInput').value = '';
            document.getElementById('fileInput').value = '';
            document.getElementById('previewContainer').style.display = 'none';
            imagenFinalBase64 = '';
        }

        window.onload = cargarDatosAdmin;
    </script>
</body>
</html>
