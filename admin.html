<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Panel de Control - Polirubro Virtual</title>
    <link rel="stylesheet" href="/style.css">
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }
        body {
            background-color: #0b0f19;
            color: #f8fafc;
            font-family: system-ui, -apple-system, sans-serif;
            padding: 20px;
        }
        .header-admin {
            display: flex;
            justify-content: space-between;
            align-items: center;
            background: #1e293b;
            padding: 15px 20px;
            border-radius: 12px;
            margin-bottom: 25px;
            border: 1px solid #334155;
        }
        .header-admin h1 {
            font-size: 1.4rem;
            color: #38bdf8;
        }
        .btn-tienda {
            background: #3b82f6;
            color: #fff;
            text-decoration: none;
            padding: 8px 16px;
            border-radius: 20px;
            font-weight: bold;
            font-size: 0.9rem;
        }
        .grid-admin {
            display: grid;
            grid-template-columns: 1fr;
            gap: 20px;
        }
        @media (min-width: 768px) {
            .grid-admin {
                grid-template-columns: 1fr 1fr;
            }
        }
        .card-admin {
            background: #111827;
            border-radius: 12px;
            padding: 20px;
            border: 1px solid #1f2937;
        }
        .card-admin h2 {
            font-size: 1.1rem;
            color: #f3f4f6;
            margin-bottom: 15px;
            display: flex;
            align-items: center;
            gap: 8px;
        }
        form {
            display: flex;
            flex-direction: column;
            gap: 12px;
        }
        label {
            font-size: 0.85rem;
            color: #9ca3af;
            font-weight: 600;
        }
        input[type="text"],
        input[type="number"],
        select,
        textarea {
            width: 100%;
            padding: 10px 12px;
            border-radius: 8px;
            border: 1px solid #374151;
            background: #1f2937;
            color: #ffffff;
            font-size: 0.95rem;
            outline: none;
        }
        input:focus, select:focus, textarea:focus {
            border-color: #38bdf8;
        }
        button[type="submit"] {
            background: #2563eb;
            color: #ffffff;
            border: none;
            padding: 12px;
            border-radius: 8px;
            font-weight: bold;
            cursor: pointer;
            transition: background 0.2s;
            margin-top: 5px;
        }
        button[type="submit"]:hover {
            background: #1d4ed8;
        }
        .preview-box {
            width: 100%;
            height: 120px;
            border: 2px dashed #374151;
            border-radius: 8px;
            display: flex;
            align-items: center;
            justify-content: center;
            overflow: hidden;
            background: #0f172a;
            margin-top: 5px;
        }
        .preview-box img {
            max-width: 100%;
            max-height: 100%;
            object-fit: contain;
        }
    </style>
</head>
<body>

    <div class="header-admin">
        <h1>⚙️ Panel Administrador</h1>
        <a href="/" class="btn-tienda">🛒 Ver Tienda</a>
    </div>

    <div class="grid-admin">
        
        <!-- SECCIÓN 1: GESTIONAR SECCIONES (SINO EMOJI) -->
        <div class="card-admin">
            <h2>📁 Gestionar Secciones</h2>
            <form action="/admin/categoria/agregar" method="POST">
                <div>
                    <label>Nueva Sección:</label>
                    <input type="text" name="nombreCat" placeholder="Ej: FUTBOL" required>
                </div>
                <button type="submit">✨ Guardar Sección</button>
            </form>
        </div>

        <!-- SECCIÓN 2: CARGAR NUEVO PRODUCTO -->
        <div class="card-admin">
            <h2>➕ Cargar Nuevo Producto</h2>
            <form action="/admin/agregar" method="POST">
                
                <div>
                    <label>Nombre del Producto:</label>
                    <input type="text" name="nombre" placeholder="Ej: Protector Solar" required>
                </div>

                <div style="display: flex; gap: 10px;">
                    <div style="flex: 1;">
                        <label>Precio (\$):</label>
                        <input type="number" name="precio" placeholder="4000" required>
                    </div>
                    <div style="flex: 1;">
                        <label>Stock:</label>
                        <input type="number" name="stock" placeholder="10" required>
                    </div>
                </div>

                <div>
                    <label>Sección / Categoría:</label>
                    <input type="text" name="categoria" placeholder="Ej: FUTBOL o Estética">
                </div>

                <div>
                    <label>Ruta de Foto (Ej: /img/mifoto.jpg):</label>
                    <input type="text" id="imagenUrl" name="imagenUrl" placeholder="/img/mifoto.jpg" oninput="actualizarPreview()">
                </div>

                <div>
                    <label>O subir desde la PC:</label>
                    <input type="file" accept="image/*" onchange="convertirYPreview(event)" style="background: none; border: none; padding: 0;">
                    <input type="hidden" name="imagenBase64" id="imagenBase64">
                </div>

                <div class="preview-box" id="boxPreview">
                    <span style="color: #6b7280; font-size: 0.85rem;">Vista previa de imagen</span>
                </div>

                <div>
                    <label>Descripción:</label>
                    <textarea name="descripcion" rows="2" placeholder="Detalles breves..."></textarea>
                </div>

                <button type="submit">📦 Guardar Producto</button>
            </form>
        </div>

    </div>

    <script>
        function actualizarPreview() {
            const url = document.getElementById('imagenUrl').value.trim();
            const box = document.getElementById('boxPreview');
            if (url) {
                box.innerHTML = `<img src="${url}" onerror="this.onerror=null; this.src='https://via.placeholder.com/150?text=Error+Imagen';">`;
            } else {
                box.innerHTML = `<span style="color: #6b7280; font-size: 0.85rem;">Vista previa de imagen</span>`;
            }
        }

        function convertirYPreview(event) {
            const file = event.target.files[0];
            if (!file) return;

            const reader = new FileReader();
            reader.onload = function(e) {
                document.getElementById('imagenBase64').value = e.target.result;
                const box = document.getElementById('boxPreview');
                box.innerHTML = `<img src="${e.target.result}">`;
                document.getElementById('imagenUrl').value = '';
            };
            reader.readAsDataURL(file);
        }
    </script>
</body>
</html>
