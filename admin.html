<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Panel Administrador | Polirubro Virtual</title>
    <link rel="stylesheet" href="/style.css">
    <style>
        body.admin-body { background-color: #0b0f19 !important; color: #f8fafc !important; font-family: system-ui, -apple-system, sans-serif !important; }
        .admin-wrapper { max-width: 1200px; margin: 0 auto; padding: 1.5rem 1rem; }
        .admin-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 1.5rem; align-items: start; }
        @media (max-width: 900px) { .admin-grid { grid-template-columns: 1fr; } }
        .admin-card { background: #0f172a; border: 1px solid #1e293b; border-radius: 18px; padding: 1.2rem; box-shadow: 0 8px 20px rgba(0,0,0,0.4); margin-bottom: 1.5rem; }
        .admin-card h3 { margin: 0 0 1rem 0; font-size: 1.1rem; color: #38bdf8; border-bottom: 1px solid #1e293b; padding-bottom: 0.5rem; }
        .form-group { margin-bottom: 0.8rem; }
        .form-label { font-size: 0.82rem; color: #cbd5e1; display: block; margin-bottom: 0.3rem; }
        .form-input { width: 100%; padding: 0.6rem; border-radius: 8px; background: #1e293b; border: 1px solid #334155; color: #fff; outline: none; font-size: 0.9rem; }
        .btn-action { background: #2563eb; color: #fff; border: none; padding: 0.7rem; border-radius: 8px; font-weight: bold; cursor: pointer; width: 100%; transition: opacity 0.2s; }
        .btn-action:hover { opacity: 0.9; }
        .lista-items { display: flex; flex-direction: column; gap: 6px; max-height: 180px; overflow-y: auto; margin-top: 10px; }
        .item-row { display: flex; justify-content: space-between; align-items: center; background: #1e293b; padding: 8px 12px; border-radius: 8px; border: 1px solid #334155; font-size: 0.88rem; }
        .btn-delete { background: #ef4444; color: #fff; border: none; padding: 4px 8px; border-radius: 6px; font-size: 0.75rem; cursor: pointer; font-weight: bold; }
        .tabla-productos { width: 100%; border-collapse: collapse; margin-top: 10px; font-size: 0.85rem; }
        .tabla-productos th, .tabla-productos td { padding: 8px 10px; border-bottom: 1px solid #334155; text-align: left; }
        .tabla-productos th { color: #38bdf8; }
    </style>
</head>
<body class="admin-body">
    <header style="background:#0f172a; padding:1.2rem; border-bottom:1px solid #1e293b; text-align:center;">
        <h1 style="margin:0; font-size:1.5rem; color:#fff;">⚙️ Panel Administrador Cloud</h1>
        <p style="margin:0.3rem 0 0 0; color:#38bdf8; font-size:0.85rem;">Sincronizado con Servidor Local / Cloud</p>
        <div style="margin-top:0.8rem;">
            <a href="/" target="_blank" style="background:#0284c7; color:#fff; padding:0.4rem 1rem; border-radius:20px; text-decoration:none; font-weight:bold; font-size:0.8rem;">🌐 Ir a la Tienda Pública</a>
        </div>
    </header>

    <div class="admin-wrapper">
        <div class="admin-grid">
            <div>
                <section class="admin-card">
                    <h3>📂 Gestionar Secciones</h3>
                    <div class="form-group">
                        <label class="form-label">Nueva Sección:</label>
                        <input type="text" id="inputNuevaCat" class="form-input" placeholder="Ej: Bazar, Ferretería">
                    </div>
                    <button type="button" onclick="guardarSeccion()" class="btn-action" style="background: #2563eb;">✨ Guardar Sección</button>
                    
                    <div style="margin-top: 15px;">
                        <label class="form-label" style="font-weight: bold; color: #38bdf8;">Secciones Existentes:</label>
                        <div class="lista-items" id="listaSeccionesAdmin"></div>
                    </div>
                </section>
            </div>

            <div>
                <section class="admin-card">
                    <h3>➕ Cargar Nuevo Producto</h3>
                    <div class="form-group">
                        <label class="form-label">Nombre del Producto:</label>
                        <input type="text" id="prodNombre" class="form-input" placeholder="Ej: Protector Solar">
                    </div>
                    <div style="display:grid; grid-template-columns:1fr 1fr; gap:0.8rem;" class="form-group">
                        <div>
                            <label class="form-label">Precio (\$):</label>
                            <input type="number" id="prodPrecio" class="form-input" placeholder="4000">
                        </div>
                        <div>
                            <label class="form-label">Stock:</label>
                            <input type="number" id="prodStock" class="form-input" value="10" min="0">
                        </div>
                    </div>
                    <div class="form-group">
                        <label class="form-label">Sección / Categoría:</label>
                        <select id="selectCategorias" class="form-input">
                            <option value="">Seleccioná una sección...</option>
                        </select>
                    </div>
                    <div class="form-group" style="display:flex; align-items:center; gap:0.5rem; background:#1e293b; padding:0.6rem; border-radius:8px; border:1px solid #334155;">
                        <input type="checkbox" id="prodOferta" style="width:18px; height:18px; cursor:pointer;">
                        <label for="prodOferta" style="font-size:0.85rem; color:#f43f5e; font-weight:bold; cursor:pointer;">🔥 Oferta Especial (48hs)</label>
                    </div>
                    <div class="form-group">
                        <label class="form-label">🖼️ Imagen (Archivo PC/Celular o URL):</label>
                        <input type="file" id="fileInput" accept="image/*" onchange="comprimirArchivoLocal()" style="margin-bottom:0.4rem; color: #cbd5e1; font-size: 0.85rem;">
                        <input type="url" id="urlInput" class="form-input" placeholder="O pegá una URL web aquí..." oninput="comprimirImagenURL(this.value)">
                        <div id="previewContainer" style="display:none; margin-top:0.5rem; text-align:center; background:#070a12; padding:8px; border-radius:8px; border:1px dashed #38bdf8;">
                            <p style="font-size: 0.75rem; color: #38bdf8; margin-bottom: 4px;">Vista Previa Optimizada:</p>
                            <img id="imgPreview" src="" alt="Preview" style="max-width:110px; max-height:110px; border-radius:6px; object-fit:contain;">
                            <p id="pesoPreview" style="font-size:0.75rem; color:#34d399; margin-top:0.2rem; font-weight:bold;"></p>
                        </div>
                    </div>
                    <button type="button" onclick="guardarProducto()" class="btn-action" style="background: #10b981;">💾 Guardar en el Servidor</button>
                </section>
            </div>
        </div>

        <section class="admin-card">
            <h3>📦 Productos en el Servidor</h3>
            <div style="overflow-x: auto;">
                <table class="tabla-productos">
                    <thead>
                        <tr>
                            <th>Nombre</th>
                            <th>Sección</th>
                            <th>Precio</th>
                            <th>Oferta</th>
                            <th>Acción</th>
                        </tr>
                    </thead>
                    <tbody id="tablaProductosAdmin">
                        <tr><td colspan="5" style="text-align: center; color: #94a3b8;">Cargando desde el servidor...</td></tr>
                    </tbody>
                </table>
            </div>
        </section>
    </div>

    <script>
        let imagenFinalOptimizada = "";
        let binCacheCompleto = {};

        async function obtenerDatosServidor() {
            try {
                const res = await fetch("/api/datos");
                if (!res.ok) throw new Error("Error al conectar");
                binCacheCompleto = await res.json();
                return binCacheCompleto;
            } catch (e) {
                console.error("Error al leer servidor:", e);
                return { productos: [], categorias: [], estadisticas: {} };
            }
        }

        async function guardarDatosServidor(datosNuevos) {
            try {
                const estructuraFinal = {
                    productos: datosNuevos.productos || [],
                    categorias: datosNuevos.categorias || binCacheCompleto.categorias || [],
                    estadisticas: binCacheCompleto.estadisticas || { totalVisitas: 0, visitasMovil: 0, visitasPC: 0, secciones: {}, busquedas: {}, porDia: {} }
                };

                const res = await fetch("/api/datos", {
                    method: "POST",
                    headers: { "Content-Type": "application/json" },
                    body: JSON.stringify(estructuraFinal)
                });
                if (!res.ok) {
                    alert("❌ El servidor rechazó los datos.");
                    return false;
                }
                return true;
            } catch (e) {
                console.error("Excepción al guardar:", e);
                alert("❌ Error de red al guardar.");
                return false;
            }
        }

        async function cargarPanelAdmin() {
            const datos = await obtenerDatosServidor();
            
            let rawCats = datos.categorias || [];
            let listaNombresCats = rawCats.map(c => typeof c === 'string' ? c : (c.nombre || c.categoria || '')).filter(c => c !== '');
            if (listaNombresCats.length === 0) listaNombresCats = ["Estética", "Electrónica", "Zapatería", "Accesorios"];

            const select = document.getElementById('selectCategorias');
            select.innerHTML = '<option value="">Seleccioná una sección...</option>';
            listaNombresCats.forEach(c => select.innerHTML += `<option value="${c}">${c}</option>`);

            const listaSec = document.getElementById('listaSeccionesAdmin');
            listaSec.innerHTML = '';
            listaNombresCats.forEach(c => {
                listaSec.innerHTML += `
                    <div class="item-row">
                        <span>🔹 ${c}</span>
                        <button class="btn-delete" onclick="eliminarSeccion('${c}')">Borrar</button>
                    </div>
                `;
            });

            const tbody = document.getElementById('tablaProductosAdmin');
            tbody.innerHTML = '';
            const prods = datos.productos || [];

            if (prods.length === 0) {
                tbody.innerHTML = `<tr><td colspan="5" style="text-align: center; color: #94a3b8;">No hay productos cargados.</td></tr>`;
                return;
            }

            prods.forEach(p => {
                const badgeOferta = p.enOferta ? '<span style="color:#f43f5e; font-weight:bold;">🔥 Sí</span>' : '<span style="color:#94a3b8;">No</span>';
                tbody.innerHTML += `
                    <tr>
                        <td style="font-weight: bold; color: #fff;">${p.nombre}</td>
                        <td><span style="background: #1e293b; padding: 3px 8px; border-radius: 4px; border: 1px solid #334155; font-size: 0.78rem;">${p.categoria}</span></td>
                        <td style="color: #38bdf8; font-weight: bold;">$${Number(p.precio).toLocaleString('es-AR')}</td>
                        <td>${badgeOferta}</td>
                        <td><button class="btn-delete" onclick="eliminarProducto(${p.id})">Eliminar</button></td>
                    </tr>
                `;
            });
        }

        async function guardarSeccion() {
            const input = document.getElementById('inputNuevaCat');
            const nombre = input.value.trim();
            if (!nombre) return alert("Escribí el nombre de la sección.");

            let datos = await obtenerDatosServidor();
            let rawCats = datos.categorias || [];

            let listaNombres = rawCats.map(c => typeof c === 'string' ? c : (c.nombre || c.categoria || ''));
            
            if (!listaNombres.includes(nombre)) {
                rawCats.push({
                    id: Date.now(),
                    nombre: nombre,
                    icono: "📁",
                    color: "linear-gradient(135deg, #3b82f6, #1d4ed8)"
                });
                datos.categorias = rawCats;

                const ok = await guardarDatosServidor(datos);
                if (ok) {
                    input.value = '';
                    await cargarPanelAdmin();
                    alert(`✅ Sección "${nombre}" guardada.`);
                }
            } else {
                alert("Esa sección ya existe.");
            }
        }

        async function eliminarSeccion(nombreCat) {
            if (confirm(`¿Seguro que querés borrar la sección "${nombreCat}"?`)) {
                let datos = await obtenerDatosServidor();
                let rawCats = datos.categorias || [];
                
                datos.categorias = rawCats.filter(c => {
                    let nom = typeof c === 'string' ? c : (c.nombre || c.categoria || '');
                    return nom !== nombreCat;
                });

                const ok = await guardarDatosServidor(datos);
                if (ok) {
                    await cargarPanelAdmin();
                }
            }
        }

        async function comprimirArchivoLocal() {
            const fileInput = document.getElementById("fileInput");
            if (!fileInput.files || fileInput.files.length === 0) return;
            const file = fileInput.files[0];

            const formData = new FormData();
            formData.append("imagen", file);

            try {
                const res = await fetch("/api/upload", {
                    method: "POST",
                    body: formData
                });
                const resultado = await res.json();
                if (resultado.success) {
                    imagenFinalOptimizada = resultado.url;
                    document.getElementById("imgPreview").src = imagenFinalOptimizada;
                    document.getElementById("pesoPreview").innerText = "Imagen subida al servidor";
                    document.getElementById("previewContainer").style.display = "block";
                    document.getElementById("urlInput").value = "";
                } else {
                    alert("❌ Error al subir la imagen: " + (resultado.error || "Formato no soportado"));
                }
            } catch (e) {
                console.error("Error de red al subir imagen:", e);
                alert("❌ Error al conectar con el servidor para subir la imagen.");
            }
        }

        function comprimirImagenURL(url) {
            if (!url || url.trim() === "") return;
            imagenFinalOptimizada = url.trim();
            document.getElementById("imgPreview").src = imagenFinalOptimizada;
            document.getElementById("pesoPreview").innerText = "URL externa";
            document.getElementById("previewContainer").style.display = "block";
            document.getElementById("fileInput").value = "";
        }

        async function guardarProducto() {
            const nombre = document.getElementById('prodNombre').value.trim();
            const precio = document.getElementById('prodPrecio').value;
            const stock = document.getElementById('prodStock').value;
            const categoria = document.getElementById('selectCategorias').value;
            const enOferta = document.getElementById('prodOferta').checked;

            if (!nombre || !precio || !categoria) return alert("Completá nombre, precio y sección.");
            if (!imagenFinalOptimizada) return alert("Por favor seleccioná una imagen.");

            let datos = await obtenerDatosServidor();
            if (!datos.productos) datos.productos = [];

            datos.productos.push({
                id: Date.now(),
                nombre,
                precio: Number(precio),
                stock: Number(stock),
                categoria,
                enOferta,
                imagen: imagenFinalOptimizada
            });

            const ok = await guardarDatosServidor(datos);
            if (ok) {
                alert(`🎉 ¡Producto "${nombre}" publicado con éxito!`);
                
                document.getElementById('prodNombre').value = '';
                document.getElementById('prodPrecio').value = '';
                document.getElementById('prodStock').value = '10';
                document.getElementById('prodOferta').checked = false;
                document.getElementById('urlInput').value = '';
                document.getElementById('fileInput').value = '';
                document.getElementById('previewContainer').style.display = 'none';
                imagenFinalOptimizada = '';

                await cargarPanelAdmin();
            }
        }

        async function eliminarProducto(idProd) {
            if (confirm("¿Estás seguro de eliminar este producto?")) {
                let datos = await obtenerDatosServidor();
                datos.productos = (datos.productos || []).filter(p => p.id !== idProd);
                await guardarDatosServidor(datos);
                await cargarPanelAdmin();
            }
        }

        window.onload = cargarPanelAdmin;
    </script>
</body>
</html>
