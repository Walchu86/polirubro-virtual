<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Polirubro Virtual | Catálogo Online</title>
    <link rel="stylesheet" href="/style.css">
</head>
<body>

    <!-- Banner de Envío Gratis -->
    <div class="promo-banner">
        🚚 ¡ENVÍO GRATIS en compras mayores a \$20.000! 📦
    </div>

    <!-- Cabecera clásica de Tienda -->
    <header>
        <div class="header-container">
            <a href="/" class="logo-title">
                🛒 Polirubro <span>Virtual</span>
            </a>
        </div>
    </header>

    <!-- Barra de Navegación Estilo Blogger Store -->
    <nav class="main-nav">
        <div class="nav-container">
            <ul class="nav-links">
                <li><a href="/">Inicio</a></li>
                <li><a href="#" onclick="filtrarPorCat('Todos'); return false;">Catálogo</a></li>
            </ul>
            <!-- Widget de Carrito en la barra superior -->
            <div class="cart-nav-widget" onclick="toggleCarrito()">
                🛒 Mi Carrito: <span id="cantCarrito">0</span> item(s) | Total: <span id="totalCarritoNav">\$0</span>
            </div>
        </div>
    </nav>

    <!-- Estructura de dos columnas (Contenido principal + Barra lateral) -->
    <div class="main-layout">
        
        <!-- Columna Izquierda: Buscador y Productos -->
        <main>
            <div class="search-box">
                <input type="text" id="inputBuscador" class="search-input" placeholder="🔍 Buscar productos en la tienda..." oninput="filtrarProductos()">
            </div>

            <!-- Grid de Productos -->
            <div class="productos-grid" id="contenedorProductos"></div>
        </main>

        <!-- Columna Derecha: Barra Lateral de Categorías (Product Category) -->
        <aside class="sidebar">
            <h3 class="sidebar-title">Categorías</h3>
            <div class="sidebar-menu" id="contenedorCategorias"></div>
        </aside>

    </div>

    <!-- Modal del Carrito Lateral -->
    <div class="cart-modal" id="modalCarrito">
        <div class="cart-header">
            <h3 style="font-size: 1.1rem;">🛒 Tu Carrito de Compras</h3>
            <button onclick="toggleCarrito()" style="background: none; border: none; font-size: 1.3rem; cursor: pointer; color: #333;">✕</button>
        </div>
        <div class="cart-items" id="itemsCarrito"></div>
        <div class="cart-footer">
            <div style="display: flex; justify-content: space-between; font-weight: bold; font-size: 1.1rem; color: #333;">
                <span>Total:</span>
                <span id="totalCarritoModal" style="color: #cc0000;">\$0</span>
            </div>
            <div id="avisoEnvioGratis" style="font-size: 0.8rem; font-weight: bold; text-align: center;"></div>
            <button class="btn-whatsapp" onclick="enviarPedidoWhatsApp()">
                📲 Enviar Pedido por WhatsApp
            </button>
        </div>
    </div>

    <script>
        let listaProductos = [];
        let listaCategorias = [];
        let carrito = [];
        let categoriaSeleccionada = 'Todos';

        const NUMERO_WHATSAPP = "5493794000000"; // Reemplazá con tu número real

        async function iniciarTienda() {
            try {
                const resProds = await fetch('/api/productos').catch(() => null);
                const resCats = await fetch('/api/categorias').catch(() => null);

                if (resProds && resProds.ok) listaProductos = await resProds.json();
                if (resCats && resCats.ok) listaCategorias = await resCats.json();

                renderizarCategorias();
                renderizarProductos();
            } catch (err) {
                console.error("Error al cargar la tienda:", err);
            }
        }

        function renderizarCategorias() {
            const cont = document.getElementById('contenedorCategorias');
            cont.innerHTML = `<button class="btn-categoria ${categoriaSeleccionada === 'Todos' ? 'activa' : ''}" onclick="filtrarPorCat('Todos')">📁 Todos los productos</button>`;

            listaCategorias.forEach(cat => {
                const esActiva = categoriaSeleccionada === cat.nombre ? 'activa' : '';
                cont.innerHTML += `
                    <button class="btn-categoria ${esActiva}" onclick="filtrarPorCat('${cat.nombre}')">
                        🔹 ${cat.nombre}
                    </button>
                `;
            });
        }

        function renderizarProductos() {
            const cont = document.getElementById('contenedorProductos');
            const busqueda = document.getElementById('inputBuscador').value.toLowerCase().trim();
            cont.innerHTML = '';

            const filtrados = listaProductos.filter(p => {
                const coincideCat = categoriaSeleccionada === 'Todos' || p.categoria === categoriaSeleccionada;
                const coincideBusqueda = p.nombre.toLowerCase().includes(busqueda);
                return coincideCat && coincideBusqueda;
            });

            if (filtrados.length === 0) {
                cont.innerHTML = `<p style="grid-column: 1/-1; text-align: center; color: #666; padding: 40px 0;">No se encontraron productos en esta sección.</p>`;
                return;
            }

            filtrados.forEach(p => {
                const badge = p.enOferta ? `<span class="badge-oferta">OFERTA</span>` : '';
                cont.innerHTML += `
                    <div class="card-producto">
                        ${badge}
                        <img src="${p.imagen || 'https://via.placeholder.com/200?text=Sin+Imagen'}" class="img-producto" alt="${p.nombre}" onerror="this.src='https://via.placeholder.com/200?text=Sin+Imagen'">
                        <div style="flex-grow: 1;">
                            <div class="titulo-producto">${p.nombre}</div>
                            <div class="precio-producto">$${Number(p.precio).toLocaleString('es-AR')}</div>
                            <div class="stock-tag">Stock: ${p.stock} un.</div>
                        </div>
                        <button class="btn-add-cart" onclick="agregarAlCarrito(${p.id})">
                            AGREGAR AL CARRITO
                        </button>
                    </div>
                `;
            });
        }

        function filtrarPorCat(nombreCat) {
            categoriaSeleccionada = nombreCat;
            renderizarCategorias();
            renderizarProductos();
        }

        function filtrarProductos() {
            renderizarProductos();
        }

        function agregarAlCarrito(idProd) {
            const prod = listaProductos.find(p => p.id === idProd);
            if (!prod) return;

            const existente = carrito.find(item => item.id === idProd);
            if (existente) {
                existente.cantidad++;
            } else {
                carrito.push({ ...prod, cantidad: 1 });
            }
            actualizarCarritoUI();
        }

        function cambiarCantidad(idProd, delta) {
            const item = carrito.find(i => i.id === idProd);
            if (!item) return;
            item.cantidad += delta;
            if (item.cantidad <= 0) {
                carrito = carrito.filter(i => i.id !== idProd);
            }
            actualizarCarritoUI();
        }

        function actualizarCarritoUI() {
            const totalCant = carrito.reduce((acc, item) => acc + item.cantidad, 0);
            const totalPrecio = carrito.reduce((acc, item) => acc + (item.precio * item.cantidad), 0);

            document.getElementById('cantCarrito').innerText = totalCant;
            document.getElementById('totalCarritoNav').innerText = `$${totalPrecio.toLocaleString('es-AR')}`;
            document.getElementById('totalCarritoModal').innerText = `$${totalPrecio.toLocaleString('es-AR')}`;

            const avisoEnvio = document.getElementById('avisoEnvioGratis');
            if (totalPrecio >= 20000) {
                avisoEnvio.innerHTML = "🎉 ¡Tenés ENVÍO GRATIS!";
                avisoEnvio.style.color = "#20ba5a";
            } else {
                const falta = 20000 - totalPrecio;
                avisoEnvio.innerHTML = `Faltan $${falta.toLocaleString('es-AR')} para Envío Gratis`;
                avisoEnvio.style.color = "#cc0000";
            }

            const contItems = document.getElementById('itemsCarrito');
            contItems.innerHTML = '';

            if (carrito.length === 0) {
                contItems.innerHTML = `<p style="text-align: center; color: #666; margin-top: 20px;">El carrito está vacío.</p>`;
                avisoEnvio.innerHTML = "";
                return;
            }

            carrito.forEach(item => {
                contItems.innerHTML += `
                    <div class="cart-item">
                        <div>
                            <div style="font-weight: bold; font-size: 0.85rem; color: #333;">${item.nombre}</div>
                            <div style="color: #cc0000; font-size: 0.8rem; font-weight: bold;">$${(item.precio * item.cantidad).toLocaleString('es-AR')}</div>
                        </div>
                        <div style="display: flex; align-items: center; gap: 6px;">
                            <button onclick="cambiarCantidad(${item.id}, -1)" style="background: #e0e0e0; border: 1px solid #adadad; width: 22px; height: 22px; cursor: pointer; font-weight: bold;">-</button>
                            <span style="font-weight: bold; font-size: 0.85rem; min-width: 15px; text-align: center;">${item.cantidad}</span>
                            <button onclick="cambiarCantidad(${item.id}, 1)" style="background: #e0e0e0; border: 1px solid #adadad; width: 22px; height: 22px; cursor: pointer; font-weight: bold;">+</button>
                        </div>
                    </div>
                `;
            });
        }

        function toggleCarrito() {
            document.getElementById('modalCarrito').classList.toggle('abierto');
        }

        function enviarPedidoWhatsApp() {
            if (carrito.length === 0) {
                alert("Agregá al menos un producto al carrito.");
                return;
            }

            let mensaje = "👋 ¡Hola! Quisiera realizar el siguiente pedido:\n\n";
            let total = 0;

            carrito.forEach(item => {
                const subtotal = item.precio * item.cantidad;
                total += subtotal;
                mensaje += `• *${item.nombre}* x${item.cantidad} - $${subtotal.toLocaleString('es-AR')}\n`;
            });

            mensaje += `\n💵 *Total a Pagar:* $${total.toLocaleString('es-AR')}\n`;
            if (total >= 20000) {
                mensaje += `🚚 *¡Aplica Envío Gratis!* (Compra mayor a $20.000)\n\n`;
            } else {
                mensaje += `\n`;
            }
            mensaje += "¡Aguardo confirmación de stock y medio de pago! Gracias.";

            const url = `https://wa.me/${NUMERO_WHATSAPP}?text=${encodeURIComponent(mensaje)}`;
            window.open(url, '_blank');
        }

        window.onload = iniciarTienda;
    </script>
</body>
</html>
