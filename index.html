<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Polirubro Virtual | Tu Tienda Online</title>
    <link rel="stylesheet" href="style.css?v=5">
</head>
<body>

    <!-- BARRA SUPERIOR DE NAVEGACIÓN Y CARRITO -->
    <header class="header-main">
        <div class="header-container">
            <div class="logo-area">
                <h1 class="site-title">🛒 Polirubro Virtual</h1>
                <p class="site-subtitle">Envíos a domicilio y las mejores ofertas</p>
            </div>
            <div class="cart-summary-btn" onclick="toggleCarritoModal()">
                <span>🛒 <strong id="cartCount">0</strong> un.</span>
                <span class="cart-total-badge">Total: \$<strong id="cartTotalHeader">0</strong></span>
                <button class="btn-ver-carrito">Ver Carrito ➔</button>
            </div>
        </div>
    </header>

    <!-- BARRA DE BÚSQUEDA Y FILTROS POR CATEGORÍA -->
    <nav class="filters-bar">
        <div class="filters-container">
            <input type="text" id="inputBuscador" placeholder="🔍 Buscar producto..." oninput="filtrarProductos()">
            <div class="categories-scroll" id="contenedorCategorias">
                <!-- Se generan dinámicamente desde el JSON -->
            </div>
        </div>
    </nav>

    <!-- CONTENEDOR PRINCIPAL DE PRODUCTOS -->
    <main class="main-content">
        <section class="catalog-section">
            <h2 class="section-title">🌟 Catálogo de Productos</h2>
            <div class="products-grid" id="gridProductos">
                <!-- Se cargan dinámicamente -->
            </div>
        </section>
    </main>

    <!-- MODAL / VENTANA DEL CARRITO DE COMPRAS -->
    <div id="modalCarrito" class="modal-overlay" style="display: none;">
        <div class="modal-content">
            <div class="modal-header">
                <h3>🛍️ Tu Carrito de Compras</h3>
                <button class="btn-cerrar-modal" onclick="toggleCarritoModal()">✖</button>
            </div>
            <div class="modal-body" id="listaCarrito">
                <!-- Ítems del carrito -->
            </div>
            <div class="modal-footer">
                <div class="total-row">
                    <span>Total a Pagar:</span>
                    <strong class="total-monto">\$<span id="cartTotalModal">0</span></strong>
                </div>
                <button class="btn-whatsapp-checkout" onclick="enviarPedidoWhatsApp()">
                    📲 Enviar Pedido por WhatsApp
                </button>
            </div>
        </div>
    </div>

    <!-- BOTÓN FLOTANTE WHATSAPP -->
    <a href="https://wa.me/543794000000?text=Hola!%20Tengo%20una%20consulta%20sobre%20la%20tienda." target="_blank" class="btn-float-wa" title="Contacto directo">
        💬 ¿Necesitás ayuda?
    </a>

    <!-- LÓGICA DE LA TIENDA -->
    <script>
        let todosLosProductos = [];
        let carrito = JSON.parse(localStorage.getItem('carrito_polirubro')) || [];
        let categoriaActiva = 'TODAS';

        // Cargar productos exclusivamente desde el archivo productos.json
        async function cargarProductos() {
            const grid = document.getElementById('gridProductos');
            grid.innerHTML = '<p style="text-align:center; width:100%; color:#94a3b8; padding: 2rem;">Cargando catálogo actualizado...</p>';

            try {
                const res = await fetch('productos.json?v=' + Date.now());
                if (res.ok) {
                    const data = await res.json();
                    todosLosProductos = data.productos || [];
                    
                    // Cargar botones de categorías dinámicamente
                    const categorias = data.categorias || ["Estética", "Electrónica", "Zapatería", "Accesorios"];
                    renderizarCategorias(categorias);
                    
                    // Renderizar catálogo
                    filtrarProductos();
                } else {
                    grid.innerHTML = '<p style="text-align:center; width:100%; color:#f43f5e; padding: 2rem;">No se encontraron productos disponibles.</p>';
                }
            } catch (error) {
                console.error("Error al cargar productos:", error);
                grid.innerHTML = '<p style="text-align:center; width:100%; color:#f43f5e; padding: 2rem;">Error al conectar con el catálogo.</p>';
            }
        }

        function renderizarCategorias(cats) {
            const contenedor = document.getElementById('contenedorCategorias');
            let html = `<button class="btn-cat active" onclick="seleccionarCategoria('TODAS', this)">Todas</button>`;
            
            cats.forEach(c => {
                const nombreCat = typeof c === 'string' ? c : (c.nombre || c.categoria || '');
                if (nombreCat) {
                    html += `<button class="btn-cat" onclick="seleccionarCategoria('${nombreCat}', this)">${nombreCat}</button>`;
                }
            });

            contenedor.innerHTML = html;
        }

        function seleccionarCategoria(cat, btn) {
            categoriaActiva = cat;
            document.querySelectorAll('.btn-cat').forEach(b => b.classList.remove('active'));
            if (btn) btn.classList.add('active');
            filtrarProductos();
        }

        function filtrarProductos() {
            const busqueda = document.getElementById('inputBuscador').value.toLowerCase().trim();
            const grid = document.getElementById('gridProductos');

            let filtrados = todosLosProductos.filter(p => {
                const coincideCat = (categoriaActiva === 'TODAS') || (p.categoria === categoriaActiva);
                const coincideNombre = p.nombre.toLowerCase().includes(busqueda);
                return coincideCat && coincideNombre;
            });

            if (filtrados.length === 0) {
                grid.innerHTML = '<p style="text-align:center; width:100%; color:#94a3b8; padding:2rem;">No hay productos cargados en esta sección.</p>';
                return;
            }

            grid.innerHTML = filtrados.map(p => {
                const ofertaBadge = p.enOferta ? '<span class="badge-oferta">🔥 OFERTA</span>' : '';
                const imgUrl = p.imagen || 'https://via.placeholder.com/300x300?text=Sin+Imagen';
                return `
                    <div class="product-card">
                        ${ofertaBadge}
                        <div class="img-container">
                            <img src="${imgUrl}" alt="${p.nombre}" loading="lazy">
                        </div>
                        <div class="product-info">
                            <span class="product-category">${p.categoria || 'Gral'}</span>
                            <h3 class="product-title">${p.nombre}</h3>
                            <div class="price-row">
                                <span class="product-price">$${Number(p.precio).toLocaleString('es-AR')}</span>
                                <span class="product-stock">Stock: ${p.stock || 0} un.</span>
                            </div>
                            <button class="btn-add-cart" onclick="agregarAlCarrito(${p.id})">🛒 Agregar al Carrito</button>
                        </div>
                    </div>
                `;
            }).join('');
        }

        // FUNCIONES DEL CARRITO
        function agregarAlCarrito(idProd) {
            const prod = todosLosProductos.find(p => p.id === idProd);
            if (!prod) return;

            const itemExistente = carrito.find(item => item.id === idProd);
            if (itemExistente) {
                itemExistente.cantidad++;
            } else {
                carrito.push({ ...prod, cantidad: 1 });
            }

            actualizarCarrito();
        }

        function actualizarCarrito() {
            localStorage.setItem('carrito_polirubro', JSON.stringify(carrito));
            
            const totalItems = carrito.reduce((sum, item) => sum + item.cantidad, 0);
            const totalMonto = carrito.reduce((sum, item) => sum + (item.precio * item.cantidad), 0);

            document.getElementById('cartCount').innerText = totalItems;
            document.getElementById('cartTotalHeader').innerText = totalMonto.toLocaleString('es-AR');
            document.getElementById('cartTotalModal').innerText = totalMonto.toLocaleString('es-AR');

            renderizarListaCarrito();
        }

        function renderizarListaCarrito() {
            const contenedor = document.getElementById('listaCarrito');
            if (carrito.length === 0) {
                contenedor.innerHTML = '<p style="text-align:center; color:#94a3b8; padding:1rem;">Tu carrito está vacío.</p>';
                return;
            }

            contenedor.innerHTML = carrito.map(item => `
                <div class="cart-item-row">
                    <div style="flex:1;">
                        <strong style="color:#fff;">${item.nombre}</strong>
                        <div style="font-size:0.8rem; color:#38bdf8;">$${Number(item.precio).toLocaleString('es-AR')} c/u</div>
                    </div>
                    <div style="display:flex; align-items:center; gap:8px;">
                        <button onclick="cambiarCantidad(${item.id}, -1)" class="btn-qty">-</button>
                        <span style="font-weight:bold; color:#fff;">${item.cantidad}</span>
                        <button onclick="cambiarCantidad(${item.id}, 1)" class="btn-qty">+</button>
                    </div>
                </div>
            `).join('');
        }

        function cambiarCantidad(id, delta) {
            const item = carrito.find(i => i.id === id);
            if (!item) return;

            item.cantidad += delta;
            if (item.cantidad <= 0) {
                carrito = carrito.filter(i => i.id !== id);
            }
            actualizarCarrito();
        }

        function toggleCarritoModal() {
            const modal = document.getElementById('modalCarrito');
            modal.style.display = modal.style.display === 'none' ? 'flex' : 'none';
        }

        function enviarPedidoWhatsApp() {
            if (carrito.length === 0) return alert("El carrito está vacío.");

            let texto = "🛒 *NUEVO PEDIDO DE POLIRUBRO VIRTUAL*\n\n";
            carrito.forEach(i => {
                texto += `• ${i.cantidad}x ${i.nombre} - $${(i.precio * i.cantidad).toLocaleString('es-AR')}\n`;
            });
            const total = carrito.reduce((sum, item) => sum + (item.precio * item.cantidad), 0);
            texto += `\n💰 *Total a pagar:* $${total.toLocaleString('es-AR')}\n`;
            texto += `📍 *Ubicación de entrega:* (Indicar dirección)`;

            const url = `https://wa.me/543794000000?text=${encodeURIComponent(texto)}`;
            window.open(url, '_blank');
        }

        window.onload = () => {
            cargarProductos();
            actualizarCarrito();
        };
    </script>
</body>
</html>
