<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Polirubro Virtual | Todo lo que buscás, acá lo encontrás</title>
    <link rel="stylesheet" href="/style.css">
</head>
<body>

    <!-- Banner de Envío Gratis -->
    <div class="promo-banner">
        🚚 ¡ENVÍO GRATIS en compras mayores a \$20.000! 📦
    </div>

    <!-- Cabecera Principal -->
    <header class="main-header">
        <div class="header-container">
            <a href="/" class="logo-title">
                <span class="cart-animado">🛒</span>
                <div class="brand-text">
                    <h1>Polirubro <span>Virtual</span></h1>
                    <p class="tagline">¡Todo lo que buscás, acá lo encontrás!</p>
                </div>
            </a>
            <div class="quick-badge">
                ⚡ A un solo clic para comprar y llevar
            </div>
        </div>
    </header>

    <!-- Navegación y Carrito -->
    <nav class="main-nav">
        <div class="nav-container">
            <ul class="nav-links">
                <li><a href="/">Inicio</a></li>
                <li><a href="#" onclick="filtrarPorCat('Todos'); return false;">Catálogo Completo</a></li>
            </ul>
            <div class="cart-nav-widget" onclick="toggleCarrito()">
                🛒 Mi Carrito: <span id="cantCarrito">0</span> un. | Total: <span id="totalCarritoNav">\$0</span>
            </div>
        </div>
    </nav>

    <!-- Layout Principal -->
    <div class="main-layout">
        
        <!-- Contenido Central -->
        <main>
            <div class="search-box">
                <input type="text" id="inputBuscador" class="search-input" placeholder="🔍 Buscar productos en Polirubro Virtual..." oninput="filtrarProductos()">
            </div>

            <!-- Grilla de Productos -->
            <div class="productos-grid" id="contenedorProductos"></div>
        </main>

        <!-- Barra Lateral de Categorías -->
        <aside class="sidebar">
            <h3 class="sidebar-title">📂 Categorías</h3>
            <div class="sidebar-menu" id="contenedorCategorias"></div>
        </aside>

    </div>

    <!-- Modal del Carrito con Opción de Barrios / Retiro -->
    <div class="cart-modal" id="modalCarrito">
        <div class="cart-header">
            <h3>🛒 Tu Carrito de Compras</h3>
            <button onclick="toggleCarrito()" class="btn-close-cart">✕</button>
        </div>
        <div class="cart-items" id="itemsCarrito"></div>
        
        <div class="cart-shipping-box">
            <label for="selectEnvio" style="font-weight: bold; font-size: 0.85rem; color: #333; display: block; margin-bottom: 5px;">🚚 Método de Entrega / Envío:</label>
            <select id="selectEnvio" onchange="actualizarCarritoUI()" style="width: 100%; padding: 8px; border-radius: 8px; border: 1px solid #ccc; font-size: 0.85rem;">
                <option value="0">🏪 Retiro en Local / Sucursal (GRATIS)</option>
                <option value="800">🛵 Barrio Centro / Cercanías (\$800)</option>
                <option value="1200">🛵 Barrios Periféricos / Aledaños (\$1.200)</option>
            </select>
        </div>

        <div class="cart-footer">
            <div style="display: flex; justify-content: space-between; font-weight: bold; font-size: 1.1rem; color: #333;">
                <span>Total Final:</span>
                <span id="totalCarritoModal" style="color: #d97706;">\$0</span>
            </div>
            <div id="avisoEnvioGratis" style="font-size: 0.82rem; font-weight: bold; text-align: center; margin-top: 5px;"></div>
            <button class="btn-whatsapp" onclick="enviarPedidoWhatsApp()">
                📲 Enviar Pedido por WhatsApp
            </button>
        </div>
    </div>

    <!-- Botón Flotante Directo a WhatsApp -->
    <a href="https://wa.me/5493794000000?text=Hola!%20Tengo%20una%20consulta%20sobre%20Polirubro%20Virtual" target="_blank" class="wsp-float" title="Contactanos por WhatsApp">
        💬
    </a>

    <script>
        let listaProductos = [];
        let listaCategorias = [];
        let carrito = [];
        let categoriaSeleccionada = 'Todos';
        const NUMERO_WHATSAPP = "5493794000000"; // Tu número de WhatsApp real

        function iniciarTienda() {
            let datos = { categorias: ["General", "Electrónica", "Bazar"], productos: [] };
            const guardado = localStorage.getItem('polirubro_global_datos');
            if (guardado) {
                try { datos = JSON.parse(guardado); } catch(e){}
            }

            listaProductos = datos.productos;
            listaCategorias = datos.categorias;

            renderizarCategorias();
            renderizarProductos();
            iniciarRelojOfertas();
        }

        function renderizarCategorias() {
            const cont = document.getElementById('contenedorCategorias');
            cont.innerHTML = `<button class="btn-categoria ${categoriaSeleccionada === 'Todos' ? 'activa' : ''}" onclick="filtrarPorCat('Todos')">📁 Todos los productos</button>`;

            listaCategorias.forEach(catNombre => {
                const esActiva = categoriaSeleccionada === catNombre ? 'activa' : '';
                cont.innerHTML += `
                    <button class="btn-categoria ${esActiva}" onclick="filtrarPorCat('${catNombre}')">
                        ✨ ${catNombre}
                    </button>
                `;
            });
        }

        function renderizarProductos() {
            const cont = document.getElementById('contenedorProductos');
            const busqueda = document.getElementById('inputBuscador').value.toLowerCase().trim();
            cont.innerHTML = '';

            const filtrados = listaProductos.filter(p => {
                const coincideCat = categoriaSeleccionada === 'Todos' || p.categoria === categoriaSeleccionada;
                const coincideBusqueda = p.nombre.toLowerCase().includes(busqueda);
                return coincideCat && coincideBusqueda;
            });

            if (filtrados.length === 0) {
                cont.innerHTML = `<p style="grid-column: 1/-1; text-align: center; color: #666; padding: 40px 0;">No se encontraron productos en esta sección.</p>`;
                return;
            }

            filtrados.forEach(p => {
                const badge = p.enOferta ? `<div class="badge-oferta-box"><span class="badge-oferta">🔥 OFERTA 48HS</span><span class="timer-oferta" id="timer-${p.id}">47:59:59</span></div>` : '';
                cont.innerHTML += `
                    <div class="card-producto">
                        ${badge}
                        <img src="${p.imagen || 'https://via.placeholder.com/200?text=Sin+Imagen'}" class="img-producto" alt="${p.nombre}" onerror="this.src='https://via.placeholder.com/200?text=Sin+Imagen'">
                        <div style="flex-grow: 1; padding-top: 8px;">
                            <div class="titulo-producto">${p.nombre}</div>
                            <div class="precio-producto">$${Number(p.precio).toLocaleString('es-AR')}</div>
                            <div class="stock-tag">Stock disponible: ${p.stock} un.</div>
                        </div>
                        <button class="btn-add-cart" onclick="agregarAlCarrito(${p.id})">
                            🛒 AGREGAR AL CARRITO
                        </button>
                    </div>
                `;
            });
        }

        function filtrarPorCat(nombreCat) {
            categoriaSeleccionada = nombreCat;
            renderizarCategorias();
            renderizarProductos();
        }

        function filtrarProductos() {
            renderizarProductos();
        }

        function agregarAlCarrito(idProd) {
            const prod = listaProductos.find(p => p.id === idProd);
            if (!prod) return;
            const existente = carrito.find(item => item.id === idProd);
            if (existente) { existente.cantidad++; } else { carrito.push({ ...prod, cantidad: 1 }); }
            actualizarCarritoUI();
        }

        function cambiarCantidad(idProd, delta) {
            const item = carrito.find(i => i.id === idProd);
            if (!item) return;
            item.cantidad += delta;
            if (item.cantidad <= 0) { carrito = carrito.filter(i => i.id !== idProd); }
            actualizarCarritoUI();
        }

        function actualizarCarritoUI() {
            const totalCant = carrito.reduce((acc, item) => acc + item.cantidad, 0);
            const subtotalProds = carrito.reduce((acc, item) => acc + (item.precio * item.cantidad), 0);
            const costoEnvioBase = Number(document.getElementById('selectEnvio').value || 0);

            let costoEnvioFinal = costoEnvioBase;
            const avisoEnvio = document.getElementById('avisoEnvioGratis');

            if (subtotalProds >= 20000) {
                costoEnvioFinal = 0;
                avisoEnvio.innerHTML = "🎉 ¡Felicidades! Alcanzaste \$20.000: TENÉS ENVÍO GRATIS";
                avisoEnvio.style.color = "#16a34a";
            } else if (subtotalProds > 0) {
                const falta = 20000 - subtotalProds;
                avisoEnvio.innerHTML = `💡 Agregá $${falta.toLocaleString('es-AR')} más en productos para tener Envío Gratis`;
                avisoEnvio.style.color = "#d97706";
            } else {
                avisoEnvio.innerHTML = "";
            }

            const totalFinal = subtotalProds + costoEnvioFinal;

            document.getElementById('cantCarrito').innerText = totalCant;
            document.getElementById('totalCarritoNav').innerText = `$${totalFinal.toLocaleString('es-AR')}`;
            document.getElementById('totalCarritoModal').innerText = `$${totalFinal.toLocaleString('es-AR')}`;

            const contItems = document.getElementById('itemsCarrito');
            contItems.innerHTML = '';
            if (carrito.length === 0) {
                contItems.innerHTML = `<p style="text-align: center; color: #666; margin-top: 20px;">El carrito está vacío.</p>`;
                return;
            }

            carrito.forEach(item => {
                contItems.innerHTML += `
                    <div class="cart-item">
                        <div>
                            <div style="font-weight: bold; font-size: 0.85rem; color: #333;">${item.nombre}</div>
                            <div style="color: #d97706; font-size: 0.8rem; font-weight: bold;">$${(item.precio * item.cantidad).toLocaleString('es-AR')}</div>
                        </div>
                        <div style="display: flex; align-items: center; gap: 6px;">
                            <button onclick="cambiarCantidad(${item.id}, -1)" style="background: #e2e8f0; border: 1px solid #cbd5e1; width: 22px; height: 22px; cursor: pointer; font-weight: bold; border-radius: 4px;">-</button>
                            <span style="font-weight: bold; font-size: 0.85rem; min-width: 15px; text-align: center;">${item.cantidad}</span>
                            <button onclick="cambiarCantidad(${item.id}, 1)" style="background: #e2e8f0; border: 1px solid #cbd5e1; width: 22px; height: 22px; cursor: pointer; font-weight: bold; border-radius: 4px;">+</button>
                        </div>
                    </div>
                `;
            });
        }

        function toggleCarrito() {
            document.getElementById('modalCarrito').classList.toggle('abierto');
        }

        function iniciarRelojOfertas() {
            setInterval(() => {
                const ahora = new Date();
                const horas = 47 - (ahora.getHours() % 24);
                const mins = 59 - ahora.getMinutes();
                const segs = 59 - ahora.getSeconds();
                const textoTimer = `${horas.toString().padStart(2, '0')}:${mins.toString().padStart(2, '0')}:${segs.toString().padStart(2, '0')}`;
                
                document.querySelectorAll('.timer-oferta').forEach(el => {
                    el.innerText = `⏳ Termina en: ${textoTimer}`;
                });
            }, 1000);
        }

        function enviarPedidoWhatsApp() {
            if (carrito.length === 0) {
                alert("Agregá al menos un producto al carrito.");
                return;
            }

            const subtotalProds = carrito.reduce((acc, item) => acc + (item.precio * item.cantidad), 0);
            const selectEnvio = document.getElementById('selectEnvio');
            const textoEnvio = selectEnvio.options[selectEnvio.selectedIndex].text;

            let mensaje = "👋 *¡Hola Polirubro Virtual! Quisiera realizar el siguiente pedido:*\n\n";
            carrito.forEach(item => {
                mensaje += `• *${item.nombre}* x${item.cantidad} - $${(item.precio * item.cantidad).toLocaleString('es-AR')}\n`;
            });

            mensaje += `\n📍 *Método de entrega:* ${textoEnvio}\n`;
            
            if (subtotalProds >= 20000) {
                mensaje += `🚚 *¡Aplica Envío Gratis por supera $20.000!*\n`;
            }

            const totalFinal = document.getElementById('totalCarritoModal').innerText;
            mensaje += `💵 *Total Final a Pagar:* ${totalFinal}\n\n`;
            mensaje += "¡Aguardo confirmación para acordar el pago y la entrega! Muchas gracias.";

            window.open(`https://wa.me/${NUMERO_WHATSAPP}?text=${encodeURIComponent(mensaje)}`, '_blank');
        }

        window.onload = iniciarTienda;
    </script>
</body>
</html>
