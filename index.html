<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Polirubro Virtual | Tienda Online</title>
    <link rel="stylesheet" href="/style.css">
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body {
            background-color: #0b0f19;
            color: #f8fafc;
            font-family: system-ui, -apple-system, sans-serif;
            padding-bottom: 90px;
        }

        /* BANNER DE ENVÍO GRATIS */
        .promo-banner {
            background: linear-gradient(135deg, #f59e0b, #d97706);
            color: #fff;
            text-align: center;
            padding: 8px 15px;
            font-size: 0.85rem;
            font-weight: 800;
            letter-spacing: 0.5px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.3);
        }

        /* HEADER */
        header {
            background: #0f172a;
            padding: 1rem;
            border-bottom: 1px solid #1e293b;
            position: sticky;
            top: 0;
            z-index: 100;
            box-shadow: 0 4px 20px rgba(0,0,0,0.5);
        }
        .header-content {
            max-width: 1200px;
            margin: 0 auto;
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 10px;
        }
        .logo-title {
            font-size: 1.3rem;
            font-weight: 900;
            color: #fff;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        /* BUSCADOR */
        .search-box {
            max-width: 1200px;
            margin: 15px auto 5px auto;
            padding: 0 15px;
        }
        .search-input {
            width: 100%;
            padding: 12px 18px;
            border-radius: 25px;
            border: 1px solid #334155;
            background: #1e293b;
            color: #fff;
            font-size: 0.95rem;
            outline: none;
            box-shadow: inset 0 2px 4px rgba(0,0,0,0.3);
        }
        .search-input:focus { border-color: #38bdf8; }

        /* CATEGORÍAS (CARRUSEL TÁCTIL MÓVIL Y PC) */
        .categorias-container {
            display: flex;
            overflow-x: auto;
            gap: 10px;
            padding: 15px;
            max-width: 1200px;
            margin: 0 auto;
            scrollbar-width: none;
        }
        .categorias-container::-webkit-scrollbar { display: none; }

        .btn-categoria {
            flex: 0 0 auto;
            border: none;
            border-radius: 50px; /* Redondos tipo píldora moderna */
            padding: 10px 20px;
            font-weight: 800;
            cursor: pointer;
            display: inline-flex;
            align-items: center;
            gap: 8px;
            color: #ffffff;
            box-shadow: 0 4px 10px rgba(0,0,0,0.3);
            transition: all 0.2s ease;
            font-size: 0.9rem;
        }
        .btn-categoria:active { transform: scale(0.95); }
        .btn-categoria.activa { outline: 2px solid #fff; box-shadow: 0 0 15px rgba(255,255,255,0.4); }

        /* GRID DE PRODUCTOS */
        .productos-grid {
            max-width: 1200px;
            margin: 0 auto;
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(160px, 1fr));
            gap: 15px;
            padding: 15px;
        }
        @media (min-width: 768px) {
            .productos-grid {
                grid-template-columns: repeat(auto-fill, minmax(220px, 1fr));
                gap: 20px;
            }
        }

        .card-producto {
            background: #1e293b;
            border: 1px solid #334155;
            border-radius: 16px;
            overflow: hidden;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            position: relative;
            box-shadow: 0 6px 15px rgba(0,0,0,0.2);
            transition: transform 0.2s;
        }
        .card-producto:hover { transform: translateY(-4px); }
        .badge-oferta {
            position: absolute;
            top: 10px;
            left: 10px;
            background: #f43f5e;
            color: #fff;
            font-size: 0.7rem;
            font-weight: 900;
            padding: 4px 8px;
            border-radius: 12px;
            z-index: 2;
        }
        .img-producto {
            width: 100%;
            height: 150px;
            object-fit: cover;
            background: #0f172a;
        }
        .info-producto {
            padding: 12px;
            display: flex;
            flex-direction: column;
            gap: 6px;
            flex-grow: 1;
        }
        .titulo-producto {
            font-size: 0.95rem;
            font-weight: 700;
            color: #f8fafc;
            line-height: 1.2;
        }
        .precio-producto {
            font-size: 1.1rem;
            font-weight: 900;
            color: #38bdf8;
        }
        .stock-tag {
            font-size: 0.75rem;
            color: #94a3b8;
        }
        .btn-add-cart {
            background: #2563eb;
            color: #fff;
            border: none;
            padding: 10px;
            border-radius: 10px;
            font-weight: bold;
            cursor: pointer;
            margin-top: 8px;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 6px;
            transition: background 0.2s;
        }
        .btn-add-cart:hover { background: #1d4ed8; }

        /* CARRITO FLOTANTE */
        .cart-float-btn {
            position: fixed;
            bottom: 20px;
            right: 20px;
            background: #10b981;
            color: #fff;
            border: none;
            border-radius: 50px;
            padding: 14px 22px;
            font-size: 1rem;
            font-weight: 800;
            display: flex;
            align-items: center;
            gap: 10px;
            box-shadow: 0 10px 25px rgba(16, 185, 129, 0.4);
            cursor: pointer;
            z-index: 999;
        }
        .cart-badge {
            background: #fff;
            color: #10b981;
            border-radius: 50%;
            width: 24px;
            height: 24px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 0.85rem;
        }

        /* MODAL DEL CARRITO */
        .cart-modal {
            position: fixed;
            top: 0; right: -100%;
            width: 100%;
            max-width: 400px;
            height: 100%;
            background: #0f172a;
            border-left: 1px solid #1e293b;
            z-index: 1000;
            transition: right 0.3s ease;
            display: flex;
            flex-direction: column;
            padding: 20px;
            box-shadow: -10px 0 30px rgba(0,0,0,0.8);
        }
        .cart-modal.abierto { right: 0; }
        .cart-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 1px solid #1e293b;
            padding-bottom: 15px;
        }
        .cart-items {
            flex-grow: 1;
            overflow-y: auto;
            margin: 15px 0;
            display: flex;
            flex-direction: column;
            gap: 12px;
        }
        .cart-item {
            display: flex;
            justify-content: space-between;
            align-items: center;
            background: #1e293b;
            padding: 10px;
            border-radius: 10px;
        }
        .cart-footer {
            border-top: 1px solid #1e293b;
            padding-top: 15px;
            display: flex;
            flex-direction: column;
            gap: 12px;
        }
        .btn-whatsapp {
            background: #25d366;
            color: #fff;
            border: none;
            padding: 14px;
            border-radius: 12px;
            font-weight: 900;
            font-size: 1rem;
            cursor: pointer;
            text-align: center;
            text-decoration: none;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
        }
    </style>
</head>
<body>

    <!-- Banner de Envío Gratis -->
    <div class="promo-banner">
        🚚 ¡ENVÍO GRATIS en compras mayores a \$20.000! 📦
    </div>

    <header>
        <div class="header-content">
            <div class="logo-title">🛍️ Polirubro Virtual</div>
            <a href="/admin" style="color: #38bdf8; text-decoration: none; font-weight: bold; font-size: 0.85rem;">⚙️ Admin</a>
        </div>
    </header>

    <div class="search-box">
        <input type="text" id="inputBuscador" class="search-input" placeholder="🔍 Buscar productos..." oninput="filtrarProductos()">
    </div>

    <!-- Carrusel dinámico de categorías (Paleta amplia de colores y redondos) -->
    <div class="categorias-container" id="contenedorCategorias"></div>

    <!-- Grid de productos -->
    <div class="productos-grid" id="contenedorProductos"></div>

    <!-- Botón flotante del carrito -->
    <button class="cart-float-btn" onclick="toggleCarrito()">
        🛒 Carrito <span class="cart-badge" id="cantCarrito">0</span>
    </button>

    <!-- Modal del Carrito -->
    <div class="cart-modal" id="modalCarrito">
        <div class="cart-header">
            <h2 style="color: #fff; font-size: 1.2rem;">🛒 Tu Pedido</h2>
            <button onclick="toggleCarrito()" style="background: none; border: none; color: #94a3b8; font-size: 1.5rem; cursor: pointer;">✕</button>
        </div>
        <div class="cart-items" id="itemsCarrito"></div>
        <div class="cart-footer">
            <div style="display: flex; justify-content: space-between; color: #fff; font-weight: bold; font-size: 1.2rem;">
                <span>Total:</span>
                <span id="totalCarrito" style="color: #38bdf8;">\$0</span>
            </div>
            <div id="avisoEnvioGratis" style="font-size: 0.8rem; color: #34d399; font-weight: bold; text-align: center;"></div>
            <button class="btn-whatsapp" onclick="enviarPedidoWhatsApp()">
                📲 Enviar Pedido por WhatsApp
            </button>
        </div>
    </div>

    <script>
        const paletaColores = [
            'linear-gradient(135deg, #ec4899, #be185d)',
            'linear-gradient(135deg, #3b82f6, #1d4ed8)',
            'linear-gradient(135deg, #f59e0b, #d97706)',
            'linear-gradient(135deg, #8b5cf6, #6d28d9)',
            'linear-gradient(135deg, #10b981, #047857)',
            'linear-gradient(135deg, #06b6d4, #0e7490)'
        ];

        let listaProductos = [];
        let listaCategorias = [];
        let carrito = [];
        let categoriaSeleccionada = 'Todos';

        const NUMERO_WHATSAPP = "5493794000000"; // Reemplazá con tu número real si querés

        async function iniciarTienda() {
            try {
                const resProds = await fetch('/api/productos').catch(() => null);
                const resCats = await fetch('/api/categorias').catch(() => null);

                if (resProds && resProds.ok) listaProductos = await resProds.json();
                if (resCats && resCats.ok) listaCategorias = await resCats.json();

                renderizarCategorias();
                renderizarProductos();
            } catch (err) {
                console.error("Iniciando tienda...", err);
            }
        }

        function renderizarCategorias() {
            const cont = document.getElementById('contenedorCategorias');
            cont.innerHTML = `<button class="btn-categoria ${categoriaSeleccionada === 'Todos' ? 'activa' : ''}" style="background: ${paletaColores[0]}" onclick="filtrarPorCat('Todos')">🔥 Todos</button>`;

            listaCategorias.forEach((cat, index) => {
                const color = cat.color || paletaColores[(index + 1) % paletaColores.length];
                const esActiva = categoriaSeleccionada === cat.nombre ? 'activa' : '';
                cont.innerHTML += `
                    <button class="btn-categoria ${esActiva}" style="background: ${color}" onclick="filtrarPorCat('${cat.nombre}')">
                        ${cat.nombre}
                    </button>
                `;
            });
        }

        function renderizarProductos() {
            const cont = document.getElementById('contenedorProductos');
            const busqueda = document.getElementById('inputBuscador').value.toLowerCase().trim();
            cont.innerHTML = '';

            const filtrados = listaProductos.filter(p => {
                const coincideCat = categoriaSeleccionada === 'Todos' || p.categoria === categoriaSeleccionada;
                const coincideBusqueda = p.nombre.toLowerCase().includes(busqueda);
                return coincideCat && coincideBusqueda;
            });

            if (filtrados.length === 0) {
                cont.innerHTML = `<p style="grid-column: 1/-1; text-align: center; color: #64748b; padding: 40px 0;">No se encontraron productos disponibles.</p>`;
                return;
            }

            filtrados.forEach(p => {
                const badge = p.enOferta ? `<span class="badge-oferta">🔥 OFERTA</span>` : '';
                cont.innerHTML += `
                    <div class="card-producto">
                        ${badge}
                        <img src="${p.imagen || 'https://via.placeholder.com/200?text=Sin+Imagen'}" class="img-producto" alt="${p.nombre}" onerror="this.src='https://via.placeholder.com/200?text=Sin+Imagen'">
                        <div class="info-producto">
                            <div class="titulo-producto">${p.nombre}</div>
                            <div class="precio-producto">$${Number(p.precio).toLocaleString('es-AR')}</div>
                            <div class="stock-tag">Stock: ${p.stock} un.</div>
                            <button class="btn-add-cart" onclick="agregarAlCarrito(${p.id})">
                                🛒 Agregar
                            </button>
                        </div>
                    </div>
                `;
            });
        }

        function filtrarPorCat(nombreCat) {
            categoriaSeleccionada = nombreCat;
            renderizarCategorias();
            renderizarProductos();
        }

        function filtrarProductos() {
            renderizarProductos();
        }

        function agregarAlCarrito(idProd) {
            const prod = listaProductos.find(p => p.id === idProd);
            if (!prod) return;

            const existente = carrito.find(item => item.id === idProd);
            if (existente) {
                existente.cantidad++;
            } else {
                carrito.push({ ...prod, cantidad: 1 });
            }
            actualizarCarritoUI();
        }

        function cambiarCantidad(idProd, delta) {
            const item = carrito.find(i => i.id === idProd);
            if (!item) return;
            item.cantidad += delta;
            if (item.cantidad <= 0) {
                carrito = carrito.filter(i => i.id !== idProd);
            }
            actualizarCarritoUI();
        }

        function actualizarCarritoUI() {
            const totalCant = carrito.reduce((acc, item) => acc + item.cantidad, 0);
            const totalPrecio = carrito.reduce((acc, item) => acc + (item.precio * item.cantidad), 0);

            document.getElementById('cantCarrito').innerText = totalCant;
            document.getElementById('totalCarrito').innerText = `$${totalPrecio.toLocaleString('es-AR')}`;

            // Validación de Envío Gratis (\$20.000)
            const avisoEnvio = document.getElementById('avisoEnvioGratis');
            if (totalPrecio >= 20000) {
                avisoEnvio.innerHTML = "🎉 ¡Felicitaciones! Tenés **ENVÍO GRATIS**.";
                avisoEnvio.style.color = "#34d399";
            } else {
                const falta = 20000 - totalPrecio;
                avisoEnvio.innerHTML = `Faltan $${falta.toLocaleString('es-AR')} para obtener **Envío Gratis**`;
                avisoEnvio.style.color = "#fbbf24";
            }

            const contItems = document.getElementById('itemsCarrito');
            contItems.innerHTML = '';

            if (carrito.length === 0) {
                contItems.innerHTML = `<p style="text-align: center; color: #64748b; margin-top: 20px;">El carrito está vacío.</p>`;
                avisoEnvio.innerHTML = "";
                return;
            }

            carrito.forEach(item => {
                contItems.innerHTML += `
                    <div class="cart-item">
                        <div>
                            <div style="color: #fff; font-weight: bold; font-size: 0.9rem;">${item.nombre}</div>
                            <div style="color: #38bdf8; font-size: 0.85rem;">$${(item.precio * item.cantidad).toLocaleString('es-AR')}</div>
                        </div>
                        <div style="display: flex; align-items: center; gap: 8px;">
                            <button onclick="cambiarCantidad(${item.id}, -1)" style="background: #334155; color: #fff; border: none; width: 26px; height: 26px; border-radius: 6px; cursor: pointer;">-</button>
                            <span style="color: #fff; font-weight: bold;">${item.cantidad}</span>
                            <button onclick="cambiarCantidad(${item.id}, 1)" style="background: #334155; color: #fff; border: none; width: 26px; height: 26px; border-radius: 6px; cursor: pointer;">+</button>
                        </div>
                    </div>
                `;
            });
        }

        function toggleCarrito() {
            document.getElementById('modalCarrito').classList.toggle('abierto');
        }

        function enviarPedidoWhatsApp() {
            if (carrito.length === 0) {
                alert("Agregá al menos un producto al carrito.");
                return;
            }

            let mensaje = "👋 ¡Hola! Quisiera realizar el siguiente pedido:\n\n";
            let total = 0;

            carrito.forEach(item => {
                const subtotal = item.precio * item.cantidad;
                total += subtotal;
                mensaje += `• *${item.nombre}* x${item.cantidad} - $${subtotal.toLocaleString('es-AR')}\n`;
            });

            mensaje += `\n💵 *Total a Pagar:* $${total.toLocaleString('es-AR')}\n`;
            if (total >= 20000) {
                mensaje += `🚚 *¡Aplica Envío Gratis!* (Compra mayor a $20.000)\n\n`;
            } else {
                mensaje += `\n`;
            }
            mensaje += "¡Aguardo confirmación de stock y medio de pago! Gracias.";

            const url = `https://wa.me/${NUMERO_WHATSAPP}?text=${encodeURIComponent(mensaje)}`;
            window.open(url, '_blank');
        }

        window.onload = iniciarTienda;
    </script>
</body>
</html>
