<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Polirubro Virtual</title>
    <link rel="stylesheet" href="/style.css">
    <style>
        body {
            background-color: #0b0f19;
            color: #f8fafc;
            font-family: system-ui, -apple-system, sans-serif;
            margin: 0;
            padding: 0;
        }
        header {
            background: #0f172a;
            padding: 1.2rem;
            text-align: center;
            border-bottom: 1px solid #1e293b;
        }
        h1 {
            margin: 0;
            font-size: 1.5rem;
            color: #fff;
        }
        /* Contenedor de categorías optimizado para celulares */
        .categorias-container {
            display: flex;
            overflow-x: auto;
            gap: 10px;
            padding: 15px;
            background: #111827;
            border-bottom: 1px solid #1f2937;
            scrollbar-width: none; /* Oculta barra en Firefox */
        }
        .categorias-container::-webkit-scrollbar {
            display: none; /* Oculta barra en Chrome/Safari */
        }
        .btn-categoria {
            flex: 0 0 auto;
            border: none;
            border-radius: 50px; /* Redondos / estilo píldora moderna */
            padding: 10px 18px;
            font-weight: bold;
            cursor: pointer;
            display: inline-flex;
            align-items: center;
            gap: 8px;
            color: #ffffff;
            box-shadow: 0 4px 6px rgba(0,0,0,0.2);
            transition: transform 0.2s, opacity 0.2s;
            font-size: 0.9rem;
        }
        .btn-categoria:active {
            transform: scale(0.95);
        }
        /* Cuadricula de productos adaptativa para celular */
        .productos-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(150px, 1fr));
            gap: 12px;
            padding: 15px;
        }
        .producto-card {
            background: #1e293b;
            border-radius: 12px;
            overflow: hidden;
            border: 1px solid #334155;
            display: flex;
            flex-direction: column;
        }
        .producto-img {
            width: 100%;
            height: 140px;
            object-fit: cover;
            background: #0f172a;
        }
        .producto-info {
            padding: 10px;
            display: flex;
            flex-direction: column;
            gap: 5px;
            flex-grow: 1;
        }
        .producto-nombre {
            font-size: 0.95rem;
            font-weight: bold;
            color: #fff;
            margin: 0;
        }
        .producto-precio {
            color: #38bdf8;
            font-weight: 900;
            font-size: 1rem;
            margin: 0;
        }
        @media (min-width: 768px) {
            .productos-grid {
                grid-template-columns: repeat(auto-fill, minmax(220px, 1fr));
                gap: 20px;
                padding: 20px;
            }
            .producto-img {
                height: 180px;
            }
        }
    </style>
</head>
<body>

    <header>
        <h1>🛍️ Polirubro Virtual</h1>
        <p style="margin: 5px 0 0 0; color: #94a3b8; font-size: 0.85rem;">Catálogo digital en tiempo real</p>
    </header>

    <!-- Contenedor dinámico de categorías (Carrusel horizontal táctil para móviles) -->
    <div class="categorias-container" id="contenedorCategorias">
        <!-- Los botones se cargan automáticamente aquí -->
    </div>

    <!-- Contenedor de productos -->
    <div class="productos-grid" id="contenedorProductos">
        <!-- Los productos se cargan automáticamente aquí -->
    </div>

    <script>
        // Paleta amplia de colores modernos y vibrantes
        const paletaColores = [
            'linear-gradient(135deg, #ec4899, #be185d)', // Fucsia
            'linear-gradient(135deg, #3b82f6, #1d4ed8)', // Azul
            'linear-gradient(135deg, #f59e0b, #d97706)', // Naranja
            'linear-gradient(135deg, #8b5cf6, #6d28d9)', // Violeta
            'linear-gradient(135deg, #10b981, #047857)', // Verde esmeralda
            'linear-gradient(135deg, #06b6d4, #0e7490)', // Celeste
            'linear-gradient(135deg, #ef4444, #b91c1c)'  // Rojo
        ];

        // Simulación o carga de datos (Se conecta con tu JSON / servidor)
        async function cargarDatosTienda() {
            try {
                // Aquí podés adaptar la llamada a tu API o JSONBin si usas fetch directo
                // Por defecto simulamos la estructura que ya tenés funcionando:
                const categorias = [
                    { id: 1, nombre: 'Todos', icono: '🔥' },
                    { id: 2, nombre: 'Estética', icono: '💄' },
                    { id: 3, nombre: 'Electrónica', icono: '🎧' },
                    { id: 4, nombre: 'Zapatería', icono: '👟' },
                    { id: 5, nombre: 'Accesorios', icono: '📱' }
                ];

                renderizarCategorias(categorias);
            } catch (e) {
                console.error("Error al cargar la tienda", e);
            }
        }

        function renderizarCategorias(categorias) {
            const contenedor = document.getElementById('contenedorCategorias');
            contenedor.innerHTML = '';

            categorias.forEach((cat, index) => {
                const colorFondo = paletaColores[index % paletaColores.length];
                
                const boton = document.createElement('button');
                boton.className = 'btn-categoria';
                boton.style.background = colorFondo;
                boton.innerHTML = `<span>${cat.icono || '📦'}</span><span>${cat.nombre}</span>`;
                
                boton.onclick = () => filtrarCategoria(cat.nombre);
                contenedor.appendChild(boton);
            });
        }

        function filtrarCategoria(nombreCat) {
            console.log("Filtrando por:", nombreCat);
            // Lógica de filtrado de productos
        }

        // Inicializar al cargar la página
        window.onload = cargarDatosTienda;
    </script>
</body>
</html>
